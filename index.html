   10. SLIDE PUZZLE
   ========================================================= */
const slideState = {
  level: 1, size: 3,
  board: [], blank: 0,
  moves: 0, par: 0,
  active: false, solved: false,
  tileEls: [],
  timerId: null, startTime: 0,
  hudMovesCache: null, hudParCache: null, hudTimeCache: ''
};
function getSlideConfig(level){
  if (level <= 120){
    return { size: 3, scramble: Math.round(6 + (level - 1) / 119 * 34) };
  } else if (level <= 400){
    return { size: 4, scramble: Math.round(20 + (level - 121) / 279 * 80) };
  } else {
    return { size: 5, scramble: Math.round(40 + (level - 401) / 99 * 120) };
  }
}
function slideNeighbors(idx, size){
  const r = Math.floor(idx / size);
  const c = idx % size;
  const res = [];
  if (r > 0) res.push(idx - size);
  if (r < size - 1) res.push(idx + size);
  if (c > 0) res.push(idx - 1);
  if (c < size - 1) res.push(idx + 1);
  return res;
}
function slideScramble(size, steps){
  const N = size * size;
  const board = [];
  for (let i = 1; i < N; i++) board.push(i);
  board.push(0);
  let blank = N - 1;
  let last = -1;
  for (let i = 0; i < steps; i++){
    const nb = slideNeighbors(blank, size).filter(n => n !== last);
    if (!nb.length) continue;
    const pick = nb[randInt(0, nb.length - 1)];
    board[blank] = board[pick];
    board[pick] = 0;
    last = blank;
    blank = pick;
  }
  return { board, blank };
}
function renderSlide(){
  const size = slideState.size;
  const board = slideState.board;
  const boardEl = $('#slideBoard');
  const needRebuild = slideState.tileEls.length !== size * size - 1;
  if (needRebuild){
    boardEl.innerHTML = '';
    slideState.tileEls = [];
    for (let v = 1; v < size * size; v++){
      const el = document.createElement('div');
      el.className = 'slide-tile';
      el.dataset.value = v;
      const face = document.createElement('div');
      face.className = 'slide-face';
      face.textContent = v;
      el.appendChild(face);
      el.addEventListener('pointerdown', onSlideTileTap);
      boardEl.appendChild(el);
      slideState.tileEls[v - 1] = el;
    }
    boardEl.style.setProperty('--n', size);
    const gapSize = size === 3 ? 5 : size === 4 ? 4 : 3;
    boardEl.style.setProperty('--gap', gapSize + 'px');
    requestAnimationFrame(function(){
      const w = boardEl.clientWidth;
      if (!w) return;
      const cellSize = w / size;
      boardEl.style.setProperty('--tile-font', Math.round(cellSize * 0.38) + 'px');
    });
  }
  const movable = new Set(slideNeighbors(slideState.blank, size));
  for (let i = 0; i < size * size; i++){
    const v = board[i];
    if (v === 0) continue;
    const el = slideState.tileEls[v - 1];
    const r = Math.floor(i / size);
    const c = i % size;
    el.style.transform = 'translate(' + (c * 100) + '%,' + (r * 100) + '%)';
    el.classList.toggle('movable', movable.has(i));
  }
}
function onSlideTileTap(e){
  if (!slideState.active || slideState.solved) return;
  const el = e.currentTarget;
  const v = +el.dataset.value;
  const idx = slideState.board.indexOf(v);
  if (idx < 0) return;
  const nb = slideNeighbors(slideState.blank, slideState.size);
  if (nb.indexOf(idx) < 0){
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
    setTimeout(function(){ el.classList.remove('bump'); }, 240);
    beep(180, 0.05, 'square', 0.03);
    return;
  }
  slideState.board[slideState.blank] = v;
  slideState.board[idx] = 0;
  slideState.blank = idx;
  slideState.moves++;
  beep(560, 0.04, 'sine', 0.04);
  vibrate(5);
  updateSlideHUD();
  renderSlide();
  if (isSlideSolved()) winSlide();
}
function isSlideSolved(){
  const board = slideState.board;
  const N = slideState.size * slideState.size;
  for (let i = 0; i < N - 1; i++){
    if (board[i] !== i + 1) return false;
  }
  return board[N - 1] === 0;
}
function updateSlideHUD(){
  const m = String(slideState.moves);
  if (m !== slideState.hudMovesCache){
    $('#slideMoves').textContent = m;
    slideState.hudMovesCache = m;
  }
  const p = String(slideState.par);
  if (p !== slideState.hudParCache){
    $('#slidePar').textContent = p;
    slideState.hudParCache = p;
  }
}
function startSlideLevel(level){
  const cfg = getSlideConfig(level);
  slideState.level = level;
  slideState.size = cfg.size;
  slideState.par = cfg.scramble;
  const sc = slideScramble(cfg.size, cfg.scramble);
  slideState.board = sc.board;
  slideState.blank = sc.blank;
  slideState.moves = 0;
  slideState.active = true;
  slideState.solved = false;
  slideState.hudMovesCache = null;
  slideState.hudParCache = null;
  slideState.hudTimeCache = '';
  slideState.tileEls = [];

  showScreen('slide');
  $('#slideLevelChip').textContent = t('levelN', {n: level});
  renderSlide();
  updateSlideHUD();
  $('#slideTime').textContent = '0:00';

  clearInterval(slideState.timerId);
  slideState.startTime = Date.now();
  slideState.timerId = setInterval(function(){
    if (!slideState.active) return;
    const elapsed = Math.floor((Date.now() - slideState.startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    const str = m + ':' + (s < 10 ? '0' : '') + s;
    if (str !== slideState.hudTimeCache){
      $('#slideTime').textContent = str;
      slideState.hudTimeCache = str;
    }
  }, 250);
}
function winSlide(){
  slideState.active = false;
  slideState.solved = true;
  clearInterval(slideState.timerId);
  slideState.timerId = null;

  const elapsed = Math.floor((Date.now() - slideState.startTime) / 1000);
  const ratio = slideState.moves / Math.max(1, slideState.par);
  const stars = ratio <= 1.4 ? 3 : ratio <= 2.2 ? 2 : 1;
  const gained = 50 + stars * 40 + Math.max(0, 120 - Math.floor(elapsed / 2));

  state.slide.score += gained;
  state.slide.unlocked = Math.max(state.slide.unlocked, Math.min(SLIDE_TOTAL, slideState.level + 1));
  save();
  updateHome();

  beep(880, 0.09, 'sine', 0.08);
  setTimeout(function(){ beep(1175, 0.1, 'sine', 0.075); }, 90);
  setTimeout(function(){ beep(1568, 0.16, 'sine', 0.07); }, 185);
  vibrate(20);

  const isFinal = slideState.level >= SLIDE_TOTAL;
  const title = isFinal ? t('allClear') : stars === 3 ? t('perfect') : stars === 2 ? t('great') : t('good');
  const movesText = t('slideMovesResult', {m: slideState.moves, p: slideState.par});

  openOverlay({
    icon: stars === 3 ? '🌟' : isFinal ? '🏆' : '🎉',
    title: title,
    sub: movesText + ' · +' + gained,
    stars: stars,
    enterToNext: !isFinal,
    primary: isFinal
      ? { label: t('levelsTitle'), fn: function(){ closeOverlay(); openSlideLevels(); } }
      : { label: t('next'), fn: function(){ closeOverlay(); startSlideLevel(slideState.level + 1); } },
    secondary: { label: t('retry'), fn: function(){ closeOverlay(); startSlideLevel(slideState.level); } }
  });
}

/* =========================================================
   11. SHOOT GAME (射击训练, 300关)
   ========================================================= */
const SHOOT_SIZE = 400; // 逻辑尺寸 400x400
const shootState = {
  canvas:null, ctx:null, dpr:1,
  level:1,
  targets:[],
  particles:[],
  shockwaves:[],
  bulletHoles:[],
  shotsLeft:0,
  targetCount:0,
  hits:0,
  shotsFired:0,
  active:false,
  aimX:-999, aimY:-999,
  showAim:false,
  lastTs:0,
  rafId:null,
  shake:0,
  flash:0,
  bgCanvas:null,
  stars:null,
  lastShotTime:0
};

function getShootConfig(level){
  const t01 = Math.min(1, (level - 1) / 299);
  const targetCount = Math.min(10, 3 + Math.floor(level / 35));
  const radius = 44 - t01 * 22;              // 44 → 22
  const speed = 30 + t01 * 140;              // 30 → 170
  const extraAmmo = Math.max(2, Math.round(6 - t01 * 4));
  return {
    targetCount: targetCount,
    radius: radius,
    speed: speed,
    ammo: targetCount + extraAmmo
  };
}

function generateShootStars(){
  shootState.stars = [];
  for (let i = 0; i < 70; i++){
    shootState.stars.push({
      x: Math.random() * SHOOT_SIZE,
      y: Math.random() * SHOOT_SIZE,
      r: Math.random() * 1.4 + 0.3,
      a: Math.random() * 0.4 + 0.15
    });
  }
}

function renderShootBg(){
  const w = 800, h = 800;
  if (!shootState.bgCanvas){
    shootState.bgCanvas = document.createElement('canvas');
  }
  const bg = shootState.bgCanvas;
  bg.width = w; bg.height = h;
  const c = bg.getContext('2d');
  c.setTransform(2, 0, 0, 2, 0, 0);
  // 深空背景
  c.fillStyle = '#080812';
  c.fillRect(0, 0, SHOOT_SIZE, SHOOT_SIZE);
  const grad = c.createRadialGradient(SHOOT_SIZE*0.5, SHOOT_SIZE*0.4, 0, SHOOT_SIZE*0.5, SHOOT_SIZE*0.4, SHOOT_SIZE*0.75);
  grad.addColorStop(0, 'rgba(80, 60, 180, 0.22)');
  grad.addColorStop(0.55, 'rgba(20, 20, 60, 0.08)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  c.fillStyle = grad;
  c.fillRect(0, 0, SHOOT_SIZE, SHOOT_SIZE);
  // 星星
  for (const s of shootState.stars){
    c.fillStyle = 'rgba(255, 255, 255, ' + s.a + ')';
    c.beginPath();
    c.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    c.fill();
  }
  // 淡网格
  c.strokeStyle = 'rgba(255, 255, 255, 0.025)';
  c.lineWidth = 0.6;
  const step = 40;
  for (let x = step; x < SHOOT_SIZE; x += step){
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x, SHOOT_SIZE); c.stroke();
  }
  for (let y = step; y < SHOOT_SIZE; y += step){
    c.beginPath(); c.moveTo(0, y); c.lineTo(SHOOT_SIZE, y); c.stroke();
  }
}

function initShootCanvas(){
  const c = $('#shootCanvas');
  shootState.canvas = c;
  shootState.ctx = c.getContext('2d', { alpha:false });
  c.width = 800;
  c.height = 800;
  shootState.ctx.setTransform(2, 0, 0, 2, 0, 0);
  if (!shootState.stars) generateShootStars();
  renderShootBg();
}

function spawnShootTarget(cfg){
  const r = cfg.radius;
  let x = 0, y = 0;
  let attempts = 0;
  const maxAttempts = 60;
  while (attempts < maxAttempts){
    attempts++;
    x = r + 12 + Math.random() * (SHOOT_SIZE - 2 * r - 24);
    y = r + 12 + Math.random() * (SHOOT_SIZE - 2 * r - 24);
    let ok = true;
    for (const t of shootState.targets){
      const dx = t.x - x, dy = t.y - y;
      if (Math.hypot(dx, dy) < t.r + r + 14){ ok = false; break; }
    }
    if (ok) break;
  }
  const angle = Math.random() * Math.PI * 2;
  const speed = cfg.speed * (0.7 + Math.random() * 0.7);
  shootState.targets.push({
    x: x, y: y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    r: r,
    hue: Math.floor(Math.random() * 360),
    wobble: Math.random() * Math.PI * 2,
    age: 0
  });
}

function startShootLevel(level){
  const cfg = getShootConfig(level);
  shootState.level = level;
  shootState.targets = [];
  shootState.particles = [];
  shootState.shockwaves = [];
  shootState.bulletHoles = [];
  shootState.shotsLeft = cfg.ammo;
  shootState.targetCount = cfg.targetCount;
  shootState.hits = 0;
  shootState.shotsFired = 0;
  shootState.active = true;
  shootState.aimX = -999;
  shootState.aimY = -999;
  shootState.showAim = false;
  shootState.shake = 0;
  shootState.flash = 0;
  shootState.lastShotTime = 0;

  for (let i = 0; i < cfg.targetCount; i++){
    spawnShootTarget(cfg);
  }

  showScreen('shoot');
  $('#shootLevelChip').textContent = t('levelN', {n: level});
  initShootCanvas();
  updateShootHUD();

  if (shootState.rafId) cancelAnimationFrame(shootState.rafId);
  shootState.lastTs = 0;
  shootState.rafId = requestAnimationFrame(shootLoop);
}

function updateShootHUD(){
  $('#shootHits').textContent = shootState.hits + '/' + shootState.targetCount;
  const ammoEl = $('#shootAmmo');
  ammoEl.textContent = shootState.shotsLeft;
  if (shootState.shotsLeft <= 2) ammoEl.className = 'shoot-stat-value danger';
  else if (shootState.shotsLeft <= 4) ammoEl.className = 'shoot-stat-value warn';
  else ammoEl.className = 'shoot-stat-value';

  let acc = 100;
  if (shootState.shotsFired > 0){
    acc = Math.round(shootState.hits / shootState.shotsFired * 100);
  }
  $('#shootAcc').textContent = acc + '%';
}

function shootLoop(ts){
  if (!shootState.active) return;
  if (!shootState.lastTs) shootState.lastTs = ts;
  let dt = (ts - shootState.lastTs) / 1000;
  shootState.lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  updateShoot(dt);
  renderShoot();
  if (shootState.active){
    shootState.rafId = requestAnimationFrame(shootLoop);
  }
}

function updateShoot(dt){
  // 目标移动
  for (const t of shootState.targets){
    t.x += t.vx * dt;
    t.y += t.vy * dt;
    if (t.x - t.r < 0){ t.x = t.r; t.vx = Math.abs(t.vx); }
    else if (t.x + t.r > SHOOT_SIZE){ t.x = SHOOT_SIZE - t.r; t.vx = -Math.abs(t.vx); }
    if (t.y - t.r < 0){ t.y = t.r; t.vy = Math.abs(t.vy); }
    else if (t.y + t.r > SHOOT_SIZE){ t.y = SHOOT_SIZE - t.r; t.vy = -Math.abs(t.vy); }
    t.wobble += dt * 4;
    t.age += dt;
  }
  // 粒子
  const ps = shootState.particles;
  for (let i = ps.length - 1; i >= 0; i--){
    const p = ps[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.life -= dt;
    if (p.life <= 0) ps.splice(i, 1);
  }
  // 冲击波
  const ws = shootState.shockwaves;
  for (let i = ws.length - 1; i >= 0; i--){
    const w = ws[i];
    w.r += w.maxR / w.maxLife * dt * 1.4;
    w.life -= dt;
    if (w.life <= 0) ws.splice(i, 1);
  }
  // 弹孔
  const bhs = shootState.bulletHoles;
  for (let i = bhs.length - 1; i >= 0; i--){
    const b = bhs[i];
    b.life -= dt;
    if (b.life <= 0) bhs.splice(i, 1);
  }
  // 震动/闪光衰减
  shootState.shake *= Math.exp(-10 * dt);
  if (shootState.shake < 0.15) shootState.shake = 0;
  shootState.flash *= Math.exp(-14 * dt);
  if (shootState.flash < 0.02) shootState.flash = 0;
}

function renderShoot(){
  const ctx = shootState.ctx;
  if (!ctx) return;

  // 背景（不震动）
  if (!shootState.bgCanvas) renderShootBg();
  ctx.drawImage(shootState.bgCanvas, 0, 0, SHOOT_SIZE, SHOOT_SIZE);

  ctx.save();
  // 震动
  if (shootState.shake > 0.1){
    const sx = (Math.random() - 0.5) * shootState.shake;
    const sy = (Math.random() - 0.5) * shootState.shake;
    ctx.translate(sx, sy);
  }

  // 弹孔
  for (const b of shootState.bulletHoles){
    const a = Math.min(1, b.life / 0.8);
    ctx.fillStyle = 'rgba(0, 0, 0, ' + (a * 0.6) + ')';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(200, 200, 255, ' + (a * 0.35) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 冲击波
  for (const w of shootState.shockwaves){
    const a = w.life / w.maxLife;
    ctx.strokeStyle = 'hsla(' + w.hue + ', 95%, 72%, ' + (a * 0.85) + ')';
    ctx.lineWidth = 2.5 * a;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 目标
  for (const t of shootState.targets){
    drawShootTarget(ctx, t);
  }

  // 粒子
  for (const p of shootState.particles){
    const a = p.life / p.maxLife;
    ctx.fillStyle = 'hsla(' + p.hue + ', 95%, 72%, ' + a + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a + 0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // 准星
  if (shootState.showAim && shootState.aimX > -100){
    drawShootCrosshair(ctx, shootState.aimX, shootState.aimY);
  }

  ctx.restore();

  // 全屏闪光
  if (shootState.flash > 0.02){
    ctx.fillStyle = 'rgba(180, 200, 255, ' + (shootState.flash * 0.25) + ')';
    ctx.fillRect(0, 0, SHOOT_SIZE, SHOOT_SIZE);
  }
}

function drawShootTarget(ctx, t){
  const wob = 1 + Math.sin(t.wobble) * 0.06;
  const r = t.r * wob;
  const x = t.x, y = t.y;
  const hue = t.hue;

  // 外发光
  const glow = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 1.9);
  glow.addColorStop(0, 'hsla(' + hue + ', 95%, 65%, 0.42)');
  glow.addColorStop(0.55, 'hsla(' + hue + ', 90%, 55%, 0.18)');
  glow.addColorStop(1, 'hsla(' + hue + ', 90%, 55%, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, r * 1.9, 0, Math.PI * 2);
  ctx.fill();

  // 内部填充
  const inner = ctx.createRadialGradient(x - r*0.3, y - r*0.3, r*0.1, x, y, r);
  inner.addColorStop(0, 'hsla(' + hue + ', 85%, 78%, 0.55)');
  inner.addColorStop(0.7, 'hsla(' + hue + ', 80%, 55%, 0.32)');
  inner.addColorStop(1, 'hsla(' + hue + ', 80%, 45%, 0.15)');
  ctx.fillStyle = inner;
  ctx.beginPath();
  ctx.arc(x, y, r * 0.92, 0, Math.PI * 2);
  ctx.fill();

  // 外环
  ctx.strokeStyle = 'hsla(' + hue + ', 95%, 72%, 0.95)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();

  // 旋转虚线环
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t.wobble * 0.6);
  ctx.strokeStyle = 'hsla(' + hue + ', 95%, 82%, 0.7)';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([4, 7]);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // 中心点
  ctx.fillStyle = 'hsla(' + hue + ', 100%, 92%, 0.95)';
  ctx.beginPath();
  ctx.arc(x, y, r * 0.22, 0, Math.PI * 2);
  ctx.fill();

  // 十字准星标记
  ctx.strokeStyle = 'hsla(' + hue + ', 90%, 80%, 0.65)';
  ctx.lineWidth = 1.4;
  const mk = r * 1.2;
  const mlen = r * 0.25;
  ctx.beginPath();
  ctx.moveTo(x - mk, y); ctx.lineTo(x - mk + mlen, y);
  ctx.moveTo(x + mk, y); ctx.lineTo(x + mk - mlen, y);
  ctx.moveTo(x, y - mk); ctx.lineTo(x, y - mk + mlen);
  ctx.moveTo(x, y + mk); ctx.lineTo(x, y + mk - mlen);
  ctx.stroke();
}

function drawShootCrosshair(ctx, x, y){
  ctx.save();
  ctx.strokeStyle = 'rgba(0, 240, 220, 0.85)';
  ctx.lineWidth = 1.6;
  const r1 = 6, r2 = 14;
  ctx.beginPath();
  ctx.arc(x, y, r1, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - r2 - 4, y); ctx.lineTo(x - r1 - 1, y);
  ctx.moveTo(x + r1 + 1, y); ctx.lineTo(x + r2 + 4, y);
  ctx.moveTo(x, y - r2 - 4); ctx.lineTo(x, y - r1 - 1);
  ctx.moveTo(x, y + r1 + 1); ctx.lineTo(x, y + r2 + 4);
  ctx.stroke();
  ctx.fillStyle = 'rgba(0, 240, 220, 0.9)';
  ctx.beginPath();
  ctx.arc(x, y, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function playShootSound(){
  if (!state.sound) return;
  try{
    const ctx = getCtx();
    const now = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(1400, now);
    o.frequency.exponentialRampToValueAtTime(180, now + 0.08);
    g.gain.setValueAtTime(0.075, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now + 0.12);
    noiseBurst(0.045, 0.045, 2400, 7000);
  }catch(e){}
}
function playHitSound(){
  if (!state.sound) return;
  beep(920, 0.06, 'sine', 0.08);
  setTimeout(function(){ beep(1380, 0.1, 'sine', 0.07); }, 45);
  noiseBurst(0.06, 0.05, 800, 5000);
}

function spawnShootExplosion(x, y, hue){
  const count = 14;
  for (let i = 0; i < count; i++){
    const ang = (i / count) * Math.PI * 2 + Math.random() * 0.35;
    const spd = 90 + Math.random() * 180;
    shootState.particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 0.5 + Math.random() * 0.35,
      maxLife: 0.85,
      size: 2 + Math.random() * 2.6,
      hue: hue
    });
  }
  shootState.shockwaves.push({
    x: x, y: y, r: 4, maxR: 62,
    life: 0.45, maxLife: 0.45, hue: hue
  });
}

function shootAt(px, py){
  if (!shootState.active) return;
  if (shootState.shotsLeft <= 0) return;
  const now = performance.now();
  if (now - shootState.lastShotTime < 70) return;
  shootState.lastShotTime = now;

  shootState.shotsLeft--;
  shootState.shotsFired++;
  shootState.shake = 7;
  shootState.flash = 0.65;

  // 找命中目标
  let hitTarget = null;
  let bestDist = Infinity;
  for (const t of shootState.targets){
    const dx = t.x - px, dy = t.y - py;
    const d = Math.hypot(dx, dy);
    if (d <= t.r && d < bestDist){
      bestDist = d;
      hitTarget = t;
    }
  }

  if (hitTarget){
    spawnShootExplosion(hitTarget.x, hitTarget.y, hitTarget.hue);
    const idx = shootState.targets.indexOf(hitTarget);
    if (idx >= 0) shootState.targets.splice(idx, 1);
    shootState.hits++;
    playHitSound();
    vibrate(12);
  } else {
    // 弹孔
    shootState.bulletHoles.push({ x: px, y: py, life: 1.6 });
    playShootSound();
    vibrate(4);
  }

  updateShootHUD();

  if (shootState.targets.length === 0){
    winShoot();
  } else if (shootState.shotsLeft <= 0){
    loseShoot();
  }
}

function winShoot(){
  if (!shootState.active) return;
  shootState.active = false;
  if (shootState.rafId){ cancelAnimationFrame(shootState.rafId); shootState.rafId = null; }

  const accuracy = shootState.shotsFired > 0
    ? shootState.hits / shootState.shotsFired
    : 1;
  const stars = accuracy >= 0.7 ? 3 : accuracy >= 0.5 ? 2 : 1;
  const gained = 70 + stars * 40 + Math.round(accuracy * 100);

  state.shoot.score += gained;
  state.shoot.unlocked = Math.max(state.shoot.unlocked, Math.min(SHOOT_TOTAL, shootState.level + 1));
  save();
  updateHome();

  beep(880, 0.09, 'sine', 0.08);
  setTimeout(function(){ beep(1175, 0.1, 'sine', 0.075); }, 90);
  setTimeout(function(){ beep(1568, 0.16, 'sine', 0.07); }, 185);
  vibrate(20);

  const isFinal = shootState.level >= SHOOT_TOTAL;
  const title = isFinal ? t('allClear') : stars === 3 ? t('perfect') : stars === 2 ? t('great') : t('good');
  const resultText = t('shootResult', {h: shootState.hits, s: shootState.shotsFired});

  openOverlay({
    icon: stars === 3 ? '🌟' : isFinal ? '🏆' : '🎯',
    title: title,
    sub: resultText + ' · +' + gained,
    stars: stars,
    enterToNext: !isFinal,
    primary: isFinal
      ? { label: t('levelsTitle'), fn: function(){ closeOverlay(); openShootLevels(); } }
      : { label: t('next'), fn: function(){ closeOverlay(); startShootLevel(shootState.level + 1); } },
    secondary: { label: t('retry'), fn: function(){ closeOverlay(); startShootLevel(shootState.level); } }
  });
}

function loseShoot(){
  if (!shootState.active) return;
  shootState.active = false;
  if (shootState.rafId){ cancelAnimationFrame(shootState.rafId); shootState.rafId = null; }

  beep(220, 0.18, 'sawtooth', 0.055);
  setTimeout(function(){ beep(150, 0.28, 'sawtooth', 0.055); }, 150);
  vibrate([40,60,40]);

  const resultText = t('shootResult', {h: shootState.hits, s: shootState.shotsFired});
  openOverlay({
    icon: '💥',
    title: t('shootFail'),
    sub: resultText,
    stars: 0,
    enterToNext: false,
    primary: { label: t('retry'), fn: function(){ closeOverlay(); startShootLevel(shootState.level); } },
    secondary: { label: t('levelsTitle'), fn: function(){ closeOverlay(); openShootLevels(); } }
  });
}

function bindShootInput(){
  const c = $('#shootCanvas');
  if (!c) return;

  const getPos = function(clientX, clientY){
    const rect = c.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return { x: 0, y: 0 };
    return {
      x: (clientX - rect.left) / rect.width * SHOOT_SIZE,
      y: (clientY - rect.top) / rect.height * SHOOT_SIZE
    };
  };

  c.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try { getCtx().resume(); } catch (err) {}
    const p = getPos(e.clientX, e.clientY);
    shootAt(p.x, p.y);
  }, {passive: false});

  c.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch') return;
    const p = getPos(e.clientX, e.clientY);
    shootState.aimX = p.x;
    shootState.aimY = p.y;
    shootState.showAim = true;
  });

  c.addEventListener('pointerleave', function(){
    shootState.showAim = false;
  });
}

/* =========================================================
   12. SNAKE
   ========================================================= */
const snakeState = {
  mode:'endless', cols:20, rows:20,
  snake:[], dir:{x:1,y:0}, nextDir:{x:1,y:0}, dirQueue:[],
  food:null, obstacles:[], score:0, speed:160,
  intervalId:null, running:false, cellEls:[], boardBuilt:false
};
function initSnakeGame(mode){
  snakeState.mode = mode;
  if (mode === 'endless'){ snakeState.cols = 20; snakeState.rows = 20; snakeState.speed = 160; }
  else if (mode === 'survival'){ snakeState.cols = 16; snakeState.rows = 16; snakeState.speed = 145; }
  else { snakeState.cols = 18; snakeState.rows = 18; snakeState.speed = 150; }
  const cx = Math.floor(snakeState.cols/2);
  const cy = Math.floor(snakeState.rows/2);
  snakeState.snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  snakeState.dir = {x:1, y:0};
  snakeState.nextDir = {x:1, y:0};
  snakeState.dirQueue = [];
  snakeState.score = 0;
  snakeState.obstacles = [];
  snakeState.food = null;
  snakeState.boardBuilt = false;
  snakeState.cellEls = [];
  placeSnakeFood();
  buildSnakeBoard();
  renderSnake();
  updateSnakeStat();
  snakeState.running = true;
  restartSnakeInterval();
}
function buildSnakeBoard(){
  const W = snakeState.cols, H = snakeState.rows;
  const board = $('#snakeBoard');
  board.className = 'snake-board' + (snakeState.mode === 'immortal' ? ' immortal' : '');
  board.innerHTML = '';
  board.style.gridTemplateColumns = 'repeat(' + W + ', 1fr)';
  board.style.gridTemplateRows = 'repeat(' + H + ', 1fr)';
  const els = [];
  for (let i=0;i<W*H;i++){
    const el = document.createElement('div');
    el.className = 'snake-cell';
    board.appendChild(el); els.push(el);
  }
  snakeState.cellEls = els;
  snakeState.boardBuilt = true;
}
function placeSnakeFood(){
  const W = snakeState.cols, H = snakeState.rows;
  const occupied = new Set();
  for (const s of snakeState.snake) occupied.add(s.y*W + s.x);
  for (const o of snakeState.obstacles) occupied.add(o.y*W + o.x);
  const free = [];
  for (let i=0;i<W*H;i++){ if (!occupied.has(i)) free.push(i); }
  if (!free.length){ snakeDie(); return; }
  const pick = free[Math.floor(Math.random()*free.length)];
  snakeState.food = { x: pick % W, y: Math.floor(pick / W) };
}
function spawnObstacle(){
  const W = snakeState.cols, H = snakeState.rows;
  const occupied = new Set();
  for (const s of snakeState.snake) occupied.add(s.y*W + s.x);
  for (const o of snakeState.obstacles) occupied.add(o.y*W + o.x);
  if (snakeState.food) occupied.add(snakeState.food.y*W + snakeState.food.x);
  const free = [];
  for (let i=0;i<W*H;i++){ if (!occupied.has(i)) free.push(i); }
  if (free.length < 8) return;
  const pick = free[Math.floor(Math.random()*free.length)];
  snakeState.obstacles.push({ x: pick % W, y: Math.floor(pick / W) });
}
function restartSnakeInterval(){
  if (snakeState.intervalId) clearInterval(snakeState.intervalId);
  if (!snakeState.running) return;
  snakeState.intervalId = setInterval(snakeTick, snakeState.speed);
}
function renderSnake(){
  if (!snakeState.boardBuilt) return;
  const W = snakeState.cols;
  const els = snakeState.cellEls;
  for (let i=0;i<els.length;i++){
    if (els[i].className !== 'snake-cell') els[i].className = 'snake-cell';
  }
  for (const o of snakeState.obstacles){
    const el = els[o.y*W + o.x];
    if (el) el.classList.add('obstacle');
  }
  if (snakeState.food){
    const el = els[snakeState.food.y*W + snakeState.food.x];
    if (el) el.classList.add('food');
  }
  for (let i = snakeState.snake.length - 1; i >= 0; i--){
    const s = snakeState.snake[i];
    const el = els[s.y*W + s.x];
    if (el) el.classList.add(i === 0 ? 'head' : 'body');
  }
}
function updateSnakeStat(){
  const modeLabel = snakeState.mode === 'endless' ? t('endlessMode')
    : snakeState.mode === 'survival' ? t('survivalMode') : t('immortalMode');
  const best = snakeState.mode === 'endless' ? state.snake.bestEndless
    : snakeState.mode === 'survival' ? state.snake.bestSurvival : state.snake.bestImmortal;
  $('#snakeStat').innerHTML = modeLabel + '<br><b>' + t('best') + ': ' + best + '</b>';
  $('#snakeScoreChip').textContent = snakeState.score;
}
function snakeTick(){
  if (!snakeState.running) return;
  if (snakeState.dirQueue.length){
    const nxt = snakeState.dirQueue.shift();
    const cur = snakeState.dir;
    if (!(nxt.x === -cur.x && nxt.y === -cur.y)){
      snakeState.dir = nxt;
    }
  }
  const head = snakeState.snake[0];
  let nx = head.x + snakeState.dir.x;
  let ny = head.y + snakeState.dir.y;
  const immortal = snakeState.mode === 'immortal';
  if (immortal){
    if (nx < 0) nx = snakeState.cols - 1;
    else if (nx >= snakeState.cols) nx = 0;
    if (ny < 0) ny = snakeState.rows - 1;
    else if (ny >= snakeState.rows) ny = 0;
  } else {
    if (nx < 0 || nx >= snakeState.cols || ny < 0 || ny >= snakeState.rows){ snakeDie(); return; }
  }
  const willEat = snakeState.food && snakeState.food.x === nx && snakeState.food.y === ny;
  const checkLen = willEat ? snakeState.snake.length : snakeState.snake.length - 1;
  if (!immortal){
    for (let i = 0; i < checkLen; i++){
      if (snakeState.snake[i].x === nx && snakeState.snake[i].y === ny){ snakeDie(); return; }
    }
  }
  if (!immortal){
    for (const o of snakeState.obstacles){
      if (o.x === nx && o.y === ny){ snakeDie(); return; }
    }
  }
  snakeState.snake.unshift({ x: nx, y: ny });
  if (!willEat) snakeState.snake.pop();
  if (willEat){
    snakeState.score++;
    snakeState.speed = Math.max(55, snakeState.speed - 3);
    if (snakeState.mode === 'survival' && snakeState.score % 3 === 0) spawnObstacle();
    placeSnakeFood();
    restartSnakeInterval();
    beep(880, 0.06, 'sine', 0.06);
    vibrate(8);
  }
  renderSnake();
  updateSnakeStat();
}
function setSnakeDir(dx, dy){
  if (!snakeState.running) return;
  const last = snakeState.dirQueue.length
    ? snakeState.dirQueue[snakeState.dirQueue.length - 1]
    : snakeState.dir;
  if (last.x === -dx && last.y === -dy) return;
  if (last.x === dx && last.y === dy) return;
  if (snakeState.dirQueue.length < 2){
    snakeState.dirQueue.push({x:dx, y:dy});
  }
}
function snakeDie(){
  if (!snakeState.running) return;
  snakeState.running = false;
  if (snakeState.intervalId){ clearInterval(snakeState.intervalId); snakeState.intervalId = null; }
  if (snakeState.mode === 'endless'){
    if (snakeState.score > state.snake.bestEndless){ state.snake.bestEndless = snakeState.score; save(); }
  } else if (snakeState.mode === 'survival'){
    if (snakeState.score > state.snake.bestSurvival){ state.snake.bestSurvival = snakeState.score; save(); }
  } else {
    if (snakeState.score > state.snake.bestImmortal){ state.snake.bestImmortal = snakeState.score; save(); }
  }
  updateSnakeStat();
  beep(220, 0.2, 'sawtooth', 0.06);
  setTimeout(function(){ beep(150, 0.3, 'sawtooth', 0.05); }, 200);
  vibrate([50,60,50]);
  openOverlay({
    icon: '💀', title: t('gameOver'), sub: t('scoreNum', {n: snakeState.score}),
    stars: 0, enterToNext: false,
    primary: { label: t('retry'), fn: function(){ closeOverlay(); startSnake(snakeState.mode); } },
    secondary: { label: t('backToMenu'), fn: function(){ closeOverlay(); openSnakeMenu(); } }
  });
}
function startSnake(mode){ showScreen('snake'); initSnakeGame(mode); }
function openSnakeMenu(){ updateHome(); showScreen('snake-menu'); }

/* =========================================================
   13. PINBALL
   ========================================================= */
const PINBALL_TIME = 30;
const PINBALL_BALL_LIFE = 6.5;
const PINBALL_BALL_R = 7;
const PINBALL_MAX_BALLS = 15;
const PINBALL_SHOOT_SPEED = 560;

const pinballState = {
  canvas:null, ctx:null, W:400, H:400, dpr:1,
  balls:[], bumpers:[], particles:[], floatTexts:[],
  score:0, timeLeft:PINBALL_TIME, active:false,
  lastTs:0, rafId:null, shootCooldown:0,
  aimX:0, aimY:0, aimTimer:0,
  bgCanvas:null, bgW:0, bgH:0, bgDpr:1,
  hudTimeCache:'', hudScoreCache:null, hudBestCache:null, hudUrgent:false
};
function initPinballCanvas(){
  const c = $('#pinballCanvas');
  pinballState.canvas = c;
  pinballState.ctx = c.getContext('2d', { alpha:false });
  resizePinballCanvas();
}
function resizePinballCanvas(){
  const c = pinballState.canvas;
  if (!c) return;
  const rect = c.getBoundingClientRect();
  const w = Math.round(rect.width), h = Math.round(rect.height);
  if (!w || !h) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = w * dpr; c.height = h * dpr;
  pinballState.dpr = dpr;
  pinballState.W = w; pinballState.H = h;
  pinballState.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!pinballState.active) buildBumpers();
  pinballState.bgCanvas = null;
}
function buildBumpers(){
  const W = pinballState.W, H = pinballState.H;
  if (!W || !H) return;
  const size = Math.min(W, H);
  const layout = [
    { rx:0.50, ry:0.17, rr:0.085, val:5 },
    { rx:0.20, ry:0.33, rr:0.070, val:3 },
    { rx:0.80, ry:0.33, rr:0.070, val:3 },
    { rx:0.50, ry:0.46, rr:0.080, val:5 },
    { rx:0.11, ry:0.58, rr:0.062, val:2 },
    { rx:0.89, ry:0.58, rr:0.062, val:2 },
    { rx:0.32, ry:0.74, rr:0.060, val:2 },
    { rx:0.68, ry:0.74, rr:0.060, val:2 }
  ];
  pinballState.bumpers = layout.map(function(it, i){
    return {
      x: it.rx * W, y: it.ry * H, r: it.rr * size,
      value: it.val, cooldown: 0,
      hue: (i * 47 + 200) % 360
    };
  });
}
function renderPinballBg(){
  const W = pinballState.W, H = pinballState.H, dpr = pinballState.dpr;
  if (!W || !H) return;
  if (!pinballState.bgCanvas) pinballState.bgCanvas = document.createElement('canvas');
  const bg = pinballState.bgCanvas;
  if (bg.width !== W*dpr || bg.height !== H*dpr){ bg.width = W*dpr; bg.height = H*dpr; }
  const c = bg.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#0a0a16'; c.fillRect(0, 0, W, H);
  const g = c.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, Math.max(W,H)*0.72);
  g.addColorStop(0, 'rgba(124, 92, 255, 0.12)');
  g.addColorStop(0.6, 'rgba(0, 224, 198, 0.04)');
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255, 255, 255, 0.035)';
  const gridStep = Math.max(24, Math.round(Math.min(W, H) / 16));
  for (let x = gridStep/2; x < W; x += gridStep){
    for (let y = gridStep/2; y < H; y += gridStep){
      c.fillRect(x - 1, y - 1, 2, 2);
    }
  }
  pinballState.bgW = W; pinballState.bgH = H; pinballState.bgDpr = dpr;
}
function startPinball(){
  showScreen('pinball');
  initPinballCanvas();
  pinballState.score = 0;
  pinballState.timeLeft = PINBALL_TIME;
  pinballState.balls = [];
  pinballState.particles = [];
  pinballState.floatTexts = [];
  pinballState.active = true;
  pinballState.lastTs = 0;
  pinballState.shootCooldown = 0;
  pinballState.aimTimer = 0;
  pinballState.hudTimeCache = '';
  pinballState.hudScoreCache = null;
  pinballState.hudBestCache = null;
  pinballState.hudUrgent = false;
  buildBumpers();
  renderPinballBg();
  updatePinballHUD();
  if (pinballState.rafId) cancelAnimationFrame(pinballState.rafId);
  pinballState.rafId = requestAnimationFrame(pinballLoop);
}
function updatePinballHUD(){
  const scoreStr = String(pinballState.score);
  if (scoreStr !== pinballState.hudScoreCache){
    $('#pinballScoreChip').textContent = scoreStr;
    pinballState.hudScoreCache = scoreStr;
  }
  const best = state.pinball.best || 0;
  if (best !== pinballState.hudBestCache){
    $('#pinballBest').textContent = t('best') + ': ' + best;
    pinballState.hudBestCache = best;
  }
  const timeStr = pinballState.timeLeft.toFixed(1) + 's';
  if (timeStr !== pinballState.hudTimeCache){
    $('#pinballTime').textContent = timeStr;
    pinballState.hudTimeCache = timeStr;
  }
  const urgent = pinballState.timeLeft <= 5;
  if (urgent !== pinballState.hudUrgent){
    $('#pinballTime').classList.toggle('urgent', urgent);
    pinballState.hudUrgent = urgent;
  }
}
function pinballLoop(ts){
  if (!pinballState.active) return;
  if (!pinballState.lastTs) pinballState.lastTs = ts;
  let dt = (ts - pinballState.lastTs) / 1000;
  pinballState.lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  updatePinball(dt);
  renderPinball();
  if (pinballState.active) pinballState.rafId = requestAnimationFrame(pinballLoop);
}
function updatePinball(dt){
  pinballState.timeLeft -= dt;
  if (pinballState.timeLeft <= 0){ pinballState.timeLeft = 0; updatePinballHUD(); endPinball(); return; }
  if (pinballState.shootCooldown > 0) pinballState.shootCooldown -= dt;
  if (pinballState.aimTimer > 0) pinballState.aimTimer -= dt;
  for (const b of pinballState.bumpers) if (b.cooldown > 0) b.cooldown -= dt;
  const sub = 2;
  for (let s = 0; s < sub; s++) stepPinballPhysics(dt / sub);
  const balls = pinballState.balls;
  for (let i = balls.length - 1; i >= 0; i--){
    const b = balls[i];
    b.life -= dt;
    const sp = Math.hypot(b.vx, b.vy);
    if (b.life <= 0 || (sp < 45 && b.age > 0.5)){ balls.splice(i, 1); continue; }
    b.age += dt;
    b.trailTimer += dt;
    if (b.trailTimer > 0.02){
      b.trailTimer = 0;
      b.trail.push({x: b.x, y: b.y});
      if (b.trail.length > 6) b.trail.shift();
    }
  }
  updatePinballParticles(dt);
  updatePinballFloatTexts(dt);
  updatePinballHUD();
}
function stepPinballPhysics(dt){
  const W = pinballState.W, H = pinballState.H;
  const bumpers = pinballState.bumpers;
  const balls = pinballState.balls;
  const R = PINBALL_BALL_R;
  for (const ball of balls){
    const fric = Math.exp(-0.9 * dt);
    ball.vx *= fric; ball.vy *= fric;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    if (ball.x - R < 0){ ball.x = R; ball.vx = Math.abs(ball.vx) * 0.92; }
    else if (ball.x + R > W){ ball.x = W - R; ball.vx = -Math.abs(ball.vx) * 0.92; }
    if (ball.y - R < 0){ ball.y = R; ball.vy = Math.abs(ball.vy) * 0.92; }
    else if (ball.y + R > H){ ball.y = H - R; ball.vy = -Math.abs(ball.vy) * 0.92; }
    for (const b of bumpers){
      const dx = ball.x - b.x, dy = ball.y - b.y;
      const dist = Math.hypot(dx, dy);
      const minDist = R + b.r;
      if (dist < minDist && dist > 0.0001){
        const nx = dx / dist, ny = dy / dist;
        const overlap = minDist - dist;
        ball.x += nx * overlap; ball.y += ny * overlap;
        const dot = ball.vx * nx + ball.vy * ny;
        ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny;
        ball.vx *= 1.16; ball.vy *= 1.16;
        const sp = Math.hypot(ball.vx, ball.vy);
        if (sp > 900){ ball.vx = ball.vx / sp * 900; ball.vy = ball.vy / sp * 900; }
        if (b.cooldown <= 0){
          b.cooldown = 0.35;
          pinballState.score += b.value;
          spawnPinballParticles(b);
          spawnPinballFloatText(b);
          beep(760 + Math.random() * 480, 0.055, 'sine', 0.05);
        }
      }
    }
  }
}
function spawnPinballParticles(bumper){
  const count = 8;
  for (let i = 0; i < count; i++){
    const ang = (i / count) * Math.PI * 2 + Math.random() * 0.4;
    const spd = 70 + Math.random() * 130;
    pinballState.particles.push({
      x: bumper.x, y: bumper.y,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: 0.45 + Math.random() * 0.3, maxLife: 0.75,
      size: 1.8 + Math.random() * 2.4, hue: bumper.hue
    });
  }
}
function spawnPinballFloatText(bumper){
  pinballState.floatTexts.push({
    x: bumper.x, y: bumper.y - bumper.r - 6,
    text: '+' + bumper.value, life: 0.7, maxLife: 0.7, hue: bumper.hue
  });
}
function updatePinballParticles(dt){
  const ps = pinballState.particles;
  for (let i = ps.length - 1; i >= 0; i--){
    const p = ps[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.93; p.vy *= 0.93;
    p.life -= dt;
    if (p.life <= 0) ps.splice(i, 1);
  }
}
function updatePinballFloatTexts(dt){
  const ts = pinballState.floatTexts;
  for (let i = ts.length - 1; i >= 0; i--){
    const f = ts[i];
    f.y -= 32 * dt; f.life -= dt;
    if (f.life <= 0) ts.splice(i, 1);
  }
}
function renderPinball(){
  const ctx = pinballState.ctx;
  if (!ctx) return;
  const W = pinballState.W, H = pinballState.H;
  const bumpers = pinballState.bumpers;
  const balls = pinballState.balls;
  const particles = pinballState.particles;
  const floatTexts = pinballState.floatTexts;
  if (!pinballState.bgCanvas || pinballState.bgW !== W || pinballState.bgH !== H || pinballState.bgDpr !== pinballState.dpr){
    renderPinballBg();
  }
  ctx.drawImage(pinballState.bgCanvas, 0, 0, W, H);
  for (const b of bumpers){
    const cd = Math.max(0, b.cooldown / 0.35);
    const scale = 1 + cd * 0.28;
    const alpha = 0.9 - cd * 0.25;
    const r = b.r * scale;
    const glow = ctx.createRadialGradient(b.x, b.y, r * 0.3, b.x, b.y, r * 2.1);
    glow.addColorStop(0, 'hsla(' + b.hue + ', 100%, 68%, ' + (0.45 * alpha) + ')');
    glow.addColorStop(1, 'hsla(' + b.hue + ', 100%, 60%, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 2.1, 0, Math.PI * 2); ctx.fill();
    const body = ctx.createRadialGradient(b.x - r*0.32, b.y - r*0.32, r*0.15, b.x, b.y, r);
    body.addColorStop(0, 'hsla(' + b.hue + ', 95%, 84%, ' + alpha + ')');
    body.addColorStop(0.62, 'hsla(' + b.hue + ', 88%, 62%, ' + alpha + ')');
    body.addColorStop(1, 'hsla(' + b.hue + ', 75%, 44%, ' + (alpha * 0.9) + ')');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, ' + (alpha * 0.95) + ')';
    ctx.font = '900 ' + Math.round(r * 0.9) + 'px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.value, b.x, b.y + 1);
  }
  for (const p of particles){
    const a = p.life / p.maxLife;
    ctx.fillStyle = 'hsla(' + p.hue + ', 90%, 72%, ' + a + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2); ctx.fill();
  }
  if (pinballState.aimTimer > 0){
    const sx = W / 2, sy = H - 26;
    const a = Math.min(1, pinballState.aimTimer / 0.4);
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.22 * a) + ')';
    ctx.lineWidth = 1.5; ctx.setLineDash([5, 7]);
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(pinballState.aimX, pinballState.aimY); ctx.stroke();
    ctx.restore();
  }
  for (const ball of balls){
    const lifeR = Math.min(1, ball.life / 0.7);
    if (ball.trail.length){
      for (let i = 0; i < ball.trail.length; i++){
        const tPt = ball.trail[i];
        const ta = (i / ball.trail.length) * 0.35 * lifeR;
        ctx.fillStyle = 'rgba(140, 220, 255, ' + ta + ')';
        ctx.beginPath();
        ctx.arc(tPt.x, tPt.y, PINBALL_BALL_R * 0.55 * (i / ball.trail.length), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    const glow = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, PINBALL_BALL_R * 2.8);
    glow.addColorStop(0, 'rgba(200, 240, 255, ' + (0.8 * lifeR) + ')');
    glow.addColorStop(0.5, 'rgba(124, 200, 255, ' + (0.3 * lifeR) + ')');
    glow.addColorStop(1, 'rgba(124, 200, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, PINBALL_BALL_R * 2.8, 0, Math.PI * 2); ctx.fill();
    const ballG = ctx.createRadialGradient(
      ball.x - PINBALL_BALL_R*0.35, ball.y - PINBALL_BALL_R*0.35, 0.5,
      ball.x, ball.y, PINBALL_BALL_R
    );
    ballG.addColorStop(0, 'rgba(255, 255, 255, ' + lifeR + ')');
    ballG.addColorStop(0.55, 'rgba(180, 230, 255, ' + lifeR + ')');
    ballG.addColorStop(1, 'rgba(110, 160, 220, ' + (lifeR * 0.9) + ')');
    ctx.fillStyle = ballG;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, PINBALL_BALL_R, 0, Math.PI * 2); ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floatTexts){
    const a = f.life / f.maxLife;
    ctx.font = '900 15px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = 'hsla(' + f.hue + ', 100%, 78%, ' + a + ')';
    ctx.shadowColor = 'hsla(' + f.hue + ', 100%, 60%, ' + a + ')';
    ctx.shadowBlur = 12;
    ctx.fillText(f.text, f.x, f.y);
    ctx.shadowBlur = 0;
  }
  const sx = W / 2, sy = H - 26;
  const sg = ctx.createRadialGradient(sx, sy, 1, sx, sy, 18);
  sg.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
  sg.addColorStop(1, 'rgba(124, 92, 255, 0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, 18, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8b6dff';
  ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2); ctx.fill();
}
function shootPinball(tx, ty){
  if (!pinballState.active) return;
  if (pinballState.shootCooldown > 0) return;
  if (pinballState.balls.length >= PINBALL_MAX_BALLS) return;
  const W = pinballState.W, H = pinballState.H;
  const sx = W / 2, sy = H - 26;
  const dx = tx - sx, dy = ty - sy;
  if (dy > -8) return;
  const dist = Math.hypot(dx, dy);
  if (dist < 24) return;
  const vx = (dx / dist) * PINBALL_SHOOT_SPEED;
  const vy = (dy / dist) * PINBALL_SHOOT_SPEED;
  pinballState.balls.push({
    x: sx, y: sy, vx: vx, vy: vy,
    life: PINBALL_BALL_LIFE, age: 0, trail: [], trailTimer: 0
  });
  pinballState.shootCooldown = 0.10;
  pinballState.aimX = tx; pinballState.aimY = ty; pinballState.aimTimer = 0.4;
  beep(320 + Math.random() * 140, 0.055, 'square', 0.04);
}
function endPinball(){
  if (!pinballState.active) return;
  pinballState.active = false;
  if (pinballState.rafId){ cancelAnimationFrame(pinballState.rafId); pinballState.rafId = null; }
  if (pinballState.score > (state.pinball.best || 0)){
    state.pinball.best = pinballState.score; save();
  }
  updateHome(); updatePinballHUD();
  beep(880, 0.1, 'sine', 0.08);
  setTimeout(function(){ beep(1175, 0.14, 'sine', 0.07); }, 100);
  setTimeout(function(){ beep(1568, 0.2, 'sine', 0.06); }, 200);
  vibrate(25);
  openOverlay({
    icon: '🎯', title: t('pinballEnd'), sub: t('scoreNum', {n: pinballState.score}),
    stars: 0, enterToNext: false,
    primary: { label: t('retry'), fn: function(){ closeOverlay(); startPinball(); } },
    secondary: { label: t('backToMenu'), fn: function(){ closeOverlay(); showScreen('home'); updateHome(); } }
  });
}
function bindPinballInput(){
  const c = $('#pinballCanvas');
  if (!c) return;
  const getPos = function(clientX, clientY){
    const rect = c.getBoundingClientRect();
    return {
      x: (clientX - rect.left) / rect.width * pinballState.W,
      y: (clientY - rect.top) / rect.height * pinballState.H
    };
  };
  c.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try { getCtx().resume(); } catch (err) {}
    const p = getPos(e.clientX, e.clientY);
    shootPinball(p.x, p.y);
  }, {passive: false});
  c.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch') return;
    if (!pinballState.active) return;
    const p = getPos(e.clientX, e.clientY);
    pinballState.aimX = p.x; pinballState.aimY = p.y; pinballState.aimTimer = 0.1;
  });
}

function playSound(type){
  try{
    const ctx = getCtx();
    const now = ctx.currentTime;
    if (type === 'pop'){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(760 + Math.random()*420, now);
      o.frequency.exponentialRampToValueAtTime(140, now + 0.085);
      g.gain.setValueAtTime(0.1, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.095);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now + 0.11);
      noiseBurst(0.03, 0.06, 2200);
    } else if (type === 'ding'){
      [1180, 1760].forEach(function(f, i){
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type='sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.085/(i+1), now+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, now+1.1);
        o.connect(g); g.connect(ctx.destination);
        o.start(now); o.stop(now+1.15);
      });
    } else if (type === 'wood'){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='triangle';
      o.frequency.setValueAtTime(520, now);
      o.frequency.exponentialRampToValueAtTime(180, now+0.06);
      g.gain.setValueAtTime(0.13, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.09);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now+0.1);
      noiseBurst(0.02, 0.05, 800, 3000);
    } else if (type === 'drop'){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(1400, now);
      o.frequency.exponentialRampToValueAtTime(560, now+0.14);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.2);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now+0.22);
    } else if (type === 'chime'){
      [1318, 1568, 1975, 2637].forEach(function(f, i){
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type='sine'; o.frequency.value = f;
        const start = now + i*0.055;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.linearRampToValueAtTime(0.06, start+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start+1.6);
        o.connect(g); g.connect(ctx.destination);
        o.start(start); o.stop(start+1.7);
      });
    } else if (type === 'pluck'){
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type='sawtooth';
      o.frequency.setValueAtTime(320, now);
      o.frequency.exponentialRampToValueAtTime(90, now+0.28);
      f.type='lowpass';
      f.frequency.setValueAtTime(2800, now);
      f.frequency.exponentialRampToValueAtTime(400, now+0.3);
      g.gain.setValueAtTime(0.1, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.35);
      o.connect(f); f.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now+0.4);
    } else if (type === 'boing'){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(140, now);
      o.frequency.exponentialRampToValueAtTime(880, now+0.13);
      o.frequency.exponentialRampToValueAtTime(380, now+0.24);
      g.gain.setValueAtTime(0.095, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.32);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now+0.35);
    } else if (type === 'shaker'){
      for (let i=0;i<3;i++) setTimeout(function(){ noiseBurst(0.055, 0.055, 3500); }, i*70);
    }
  }catch(e){}
}
function playAnimal(type){
  if (!state.sound) return;
  try{
    const ctx = getCtx();

      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      o.type='sawtooth';
      o.frequency.setValueAtTime(560, now);
      o.frequency.linearRampToValueAtTime(920, now+0.09);
      o.frequency.linearRampToValueAtTime(480, now+0.42);
      lfo.type='sine'; lfo.frequency.value=22; lg.gain.value=38;
      lfo.connect(lg); lg.connect(o.frequency);
      f.type='lowpass'; f.frequency.value=2400;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.12, now+0.03);
      g.gain.linearRampToValueAtTime(0.0001, now+0.46);
      o.connect(f); f.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now+0.5); lfo.start(now); lfo.stop(now+0.5);

        o.frequency.exponentialRampToValueAtTime(150, st+0.11);

      f.type='lowpass'; f.frequency.value=900;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.14, now+0.06);
      g.gain.linearRampToValueAtTime(0.0001, now+0.85);
      o.connect(f); f.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now+0.9); lfo.start(now); lfo.stop(now+0.9);
    } else if (type === 'duck'){
      [0, 0.13, 0.26].forEach(function(off){
        const o = ctx.createOscillator(), g = ctx.createGain();
        const st = now + off;
        o.type='square';
        o.frequency.setValueAtTime(340, st);
        o.frequency.exponentialRampToValueAtTime(200, st+0.09);
        g.gain.setValueAtTime(0.0001, st);
        g.gain.linearRampToValueAtTime(0.075, st+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, st+0.1);
        o.connect(g); g.connect(ctx.destination);
        o.start(st); o.stop(st+0.12);
      });
    } else if (type === 'frog'){
      [0, 0.2].forEach(function(off){
        const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
        const st = now + off;
        o.type='sawtooth';
        o.frequency.setValueAtTime(190, st);
        o.frequency.exponentialRampToValueAtTime(120, st+0.09);
        f.type='lowpass'; f.frequency.value=1200;
        g.gain.setValueAtTime(0.0001, st);
        g.gain.linearRampToValueAtTime(0.12, st+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, st+0.13);
        o.connect(f); f.connect(g); g.connect(ctx.destination);
        o.start(st); o.stop(st+0.15);
      });
    } else if (type === 'sheep'){
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      o.type='sawtooth';

      lfo.connect(lg); lg.connect(o.frequency);
      f.type='lowpass'; f.frequency.value=1800;
      g.gain.setValueAtTime(0.0001, now);

      g.gain.linearRampToValueAtTime(0.0001, now+0.5);
      o.connect(f); f.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now+0.55); lfo.start(now); lfo.stop(now+0.55);

      const o = ctx.createOscillator(), g = ctx.createGain();

      g.gain.setValueAtTime(0.0001, now);

      g.gain.setValueAtTime(0.075, now+0.7);
      g.gain.linearRampToValueAtTime(0.0001, now+0.85);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now+0.9); lfo.start(now); lfo.stop(now+0.9);

  }catch(e){}

let voiceList = [];
function speakHello(item, btn){
  if (!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(item.text);
    u.lang = item.code; u.rate = 0.9; u.pitch = 1.05; u.volume = 1;
    if (voiceList.length){
      const base = item.code.split('-')[0].toLowerCase();
      const match = voiceList.find(function(v){
        return v.lang.replace('_','-').toLowerCase().indexOf(base) === 0;
      });
      if (match) u.voice = match;
    }
    if (btn){
      btn.classList.add('playing');
      const clear = function(){ btn.classList.remove('playing'); };
      u.onend = clear; u.onerror = clear;
      setTimeout(clear, 2200);
    }
    window.speechSynthesis.speak(u);
  }catch(e){ if (btn) btn.classList.remove('playing'); }
}
function refreshVoiceList(){
  if (!('speechSynthesis' in window)) return;
  voiceList = window.speechSynthesis.getVoices() || [];

    document.querySelectorAll('.relax-panel').forEach(function(p){ p.style.display = 'none'; });
    const panel = document.getElementById('panel-' + target);
    if (panel) panel.style.display = '';
    beep(520, 0.04, 'sine', 0.035);
  });
});

function buildLevelsInto(gridId, total, unlocked, onPick){
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= total; i++){
    const b = document.createElement('button');
    const isUnlocked = i <= unlocked;
    b.className = 'lvl-btn' + (isUnlocked ? (i < unlocked ? ' done' : '') : ' locked');
    b.textContent = isUnlocked ? i : '🔒';
    if (!isUnlocked) b.disabled = true;
    b.addEventListener('click', (function(n){
      return function(){ closeOverlay(); onPick(n); };
    })(i));
    frag.appendChild(b);
  }
  grid.appendChild(frag);
}
function scrollToCurrent(gridId, unlocked, total){
  setTimeout(function(){
    const btns = document.getElementById(gridId).querySelectorAll('.lvl-btn');
    const target = btns[Math.min(unlocked, total) - 1];
    if (target && target.scrollIntoView) target.scrollIntoView({ block:'center' });
  }, 60);
}

/* =========================================================
   16. INPUT BINDING
   ========================================================= */
function attachSwipe(el, onSwipe){
  let start = null;
  el.addEventListener('touchstart', function(e){
    const tt = e.touches[0];
    start = { x: tt.clientX, y: tt.clientY };
  }, {passive:true});
  el.addEventListener('touchend', function(e){
    if (!start) return;
    const tt = e.changedTouches[0];
    const dx = tt.clientX - start.x, dy = tt.clientY - start.y;
    start = null;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (Math.max(adx, ady) < 22) return;
    if (adx > ady) onSwipe(dx > 0 ? 1 : -1, 0);
    else onSwipe(0, dy > 0 ? 1 : -1);
  }, {passive:true});
}
function bindMazeInput(){
  const board = $('#mazeBoard');
  let suppress = false;
  attachSwipe(board, function(dx, dy){
    suppress = true;
    setTimeout(function(){ suppress = false; }, 380);
    tryMove(dx, dy);
  });
  board.addEventListener('click', function(e){
    if (suppress) return;
    const cellEl = e.target.closest('.maze-cell');
    if (!cellEl) return;
    const idx = mazeState.cellEls.indexOf(cellEl);
    if (idx < 0) return;
    const cx = idx % mazeState.cols, cy = Math.floor(idx / mazeState.cols);
    const p = mazeState.player;
    const dx = cx - p.x, dy = cy - p.y;
    if (Math.abs(dx) + Math.abs(dy) === 1) tryMove(dx, dy);
  });
}
function bindSokobanInput(){
  const board = $('#sokobanBoard');
  attachSwipe(board, function(dx, dy){ sokobanMove(dx, dy); });
  document.querySelectorAll('#screen-sokoban .dpad-btn').forEach(function(btn){
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      const dir = this.dataset.dir;
      if (dir === 'up') sokobanMove(0,-1);
      else if (dir === 'down') sokobanMove(0,1);
      else if (dir === 'left') sokobanMove(-1,0);
      else if (dir === 'right') sokobanMove(1,0);
    });
  });
}
function bindSnakeInput(){
  const board = $('#snakeBoard');
  attachSwipe(board, function(dx, dy){ setSnakeDir(dx, dy); });
  document.querySelectorAll('#screen-snake .snake-dpad-btn').forEach(function(btn){
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      const dir = this.dataset.dir;
      if (dir === 'up') setSnakeDir(0,-1);
      else if (dir === 'down') setSnakeDir(0,1);
      else if (dir === 'left') setSnakeDir(-1,0);
      else if (dir === 'right') setSnakeDir(1,0);
    });
  });
}
function bindMatchInput(){
  const board = $('#matchBoard');
  if (!board) return;
  let touchStart = null;
  board.addEventListener('pointerdown', function(e){
    const cell = e.target.closest('.match-cell');
    if (!cell) return;
    e.preventDefault();
    try { getCtx().resume(); } catch (err) {}
    touchStart = {
      r: +cell.dataset.r,
      c: +cell.dataset.c,
      x: e.clientX,
      y: e.clientY,
      moved: false
    };
  }, {passive: false});
  board.addEventListener('pointermove', function(e){
    if (!touchStart) return;
    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;
    if (Math.hypot(dx, dy) > 18) touchStart.moved = true;
  }, {passive: true});
  board.addEventListener('pointerup', function(e){
    if (!touchStart) return;
    const startInfo = touchStart;
    touchStart = null;
    const dx = e.clientX - startInfo.x;
    const dy = e.clientY - startInfo.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 18 || !startInfo.moved){
      onMatchTileTap(startInfo.r, startInfo.c);
      return;
    }
    let dr = 0, dc = 0;
    if (Math.abs(dx) > Math.abs(dy)) dc = dx > 0 ? 1 : -1;
    else dr = dy > 0 ? 1 : -1;
    const nr = startInfo.r + dr, nc = startInfo.c + dc;
    if (nr >= 0 && nr < matchState.grid && nc >= 0 && nc < matchState.grid){
      matchState.selected = null;
      updateMatchSelection();
      matchTrySwap(startInfo.r, startInfo.c, nr, nc);
    }
  });
  board.addEventListener('pointercancel', function(){ touchStart = null; });
}

document.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){
    const ov = $('#overlay');
    if (ov.classList.contains('show')){
      const btn = $('#ovBtn');
      if (btn && btn.style.display !== 'none' && overlayPrimaryIsWin){
        e.preventDefault();
        btn.click();
        return;
      }
    }
  }
  if (e.key === 'Escape'){
    if ($('#overlay').classList.contains('show')){ closeOverlay(); return; }
  }
  if ($('#screen-maze').classList.contains('active') && mazeState.active){
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W'){ e.preventDefault(); tryMove(0,-1); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S'){ e.preventDefault(); tryMove(0,1); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A'){ e.preventDefault(); tryMove(-1,0); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D'){ e.preventDefault(); tryMove(1,0); }
  }
  if ($('#screen-sokoban').classList.contains('active') && sokobanState.active){
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W'){ e.preventDefault(); sokobanMove(0,-1); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S'){ e.preventDefault(); sokobanMove(0,1); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A'){ e.preventDefault(); sokobanMove(-1,0); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D'){ e.preventDefault(); sokobanMove(1,0); }
  }
  if ($('#screen-snake').classList.contains('active') && snakeState.running){
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W'){ e.preventDefault(); setSnakeDir(0,-1); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S'){ e.preventDefault(); setSnakeDir(0,1); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A'){ e.preventDefault(); setSnakeDir(-1,0); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D'){ e.preventDefault(); setSnakeDir(1,0); }
  }
});

let pinballResizeTimer = null;
window.addEventListener('resize', function(){
  if (pinballResizeTimer) clearTimeout(pinballResizeTimer);
  pinballResizeTimer = setTimeout(function(){
    if (pinballState.canvas) resizePinballCanvas();
    if ($('#screen-match').classList.contains('active') && matchState.active){
      const boardEl = $('#matchBoard');
      const size = boardEl.clientWidth;
      if (size){
        const grid = matchState.grid;
        const gapSize = grid <= 6 ? 5 : grid <= 8 ? 4 : 3;
        const cellSize = (size - 12 - (grid - 1) * gapSize) / grid;
        boardEl.style.setProperty('--tile-font', Math.round(cellSize * 0.58) + 'px');
      }
    }
    if ($('#screen-slide').classList.contains('active') && slideState.active){
      const boardEl = $('#slideBoard');
      const w = boardEl.clientWidth;
      if (w){
        const cellSize = w / slideState.size;
        boardEl.style.setProperty('--tile-font', Math.round(cellSize * 0.38) + 'px');
      }
    }
  }, 180);
});
