const slideState = { level:1,size:3,board:[],blank:0,moves:0,par:0,active:false,solved:false,tileEls:[],timerId:null,startTime:0,hudMovesCache:null,hudParCache:null,hudTimeCache:'' };
function getSlideConfig(lv){
  if (lv<=120) return {size:3,scramble:Math.round(6+(lv-1)/119*34)};
  if (lv<=400) return {size:4,scramble:Math.round(20+(lv-121)/279*80)};
  return {size:5,scramble:Math.round(40+(lv-401)/99*120)};
}
function slideNeighbors(idx,size){
  const r = Math.floor(idx/size), c = idx%size;
  const res = [];
  if (r>0) res.push(idx-size);
  if (r<size-1) res.push(idx+size);
  if (c>0) res.push(idx-1);
  if (c<size-1) res.push(idx+1);
  return res;
}
function slideScramble(size,steps){
  const N = size*size;
  const board = [];
  for (let i=1;i<N;i++) board.push(i);
  board.push(0);
  let blank = N-1, last = -1;
  for (let i=0;i<steps;i++){
    const nb = slideNeighbors(blank,size).filter(n=>n!==last);
    if (!nb.length) continue;
    const pick = nb[randInt(0,nb.length-1)];
    board[blank] = board[pick]; board[pick] = 0;
    last = blank; blank = pick;
  }
  return {board,blank};
}
function renderSlide(){
  const size = slideState.size, board = slideState.board;
  const boardEl = $('#slideBoard');
  const needRebuild = slideState.tileEls.length!==size*size-1;
  if (needRebuild){
    boardEl.innerHTML = '';
    slideState.tileEls = [];
    for (let v=1;v<size*size;v++){
      const el = document.createElement('div');
      el.className = 'slide-tile';
      el.dataset.value = v;
      const face = document.createElement('div');
      face.className = 'slide-face';
      face.textContent = v;
      el.appendChild(face);
      el.addEventListener('pointerdown', onSlideTileTap);
      boardEl.appendChild(el);
      slideState.tileEls[v-1] = el;
    }
    boardEl.style.setProperty('--n',size);
    boardEl.style.setProperty('--gap',(size===3?5:size===4?4:3)+'px');
    requestAnimationFrame(function(){
      const w = boardEl.clientWidth;
      if (w) boardEl.style.setProperty('--tile-font', Math.round(w/size*0.38)+'px');
    });
  }
  const movable = new Set(slideNeighbors(slideState.blank,size));
  for (let i=0;i<size*size;i++){
    const v = board[i];
    if (v===0) continue;
    const el = slideState.tileEls[v-1];
    const r = Math.floor(i/size), c = i%size;
    el.style.transform = `translate(${c*100}%,${r*100}%)`;
    el.classList.toggle('movable', movable.has(i));
  }
}
function onSlideTileTap(e){
  if (!slideState.active||slideState.solved) return;
  const el = e.currentTarget;
  const v = +el.dataset.value;
  const idx = slideState.board.indexOf(v);
  if (idx<0) return;
  const nb = slideNeighbors(slideState.blank,slideState.size);
  if (nb.indexOf(idx)<0){
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    setTimeout(function(){ el.classList.remove('bump'); }, 240);
    beep(180,0.05,'square',0.03);
    return;
  }
  slideState.board[slideState.blank] = v;
  slideState.board[idx] = 0;
  slideState.blank = idx;
  slideState.moves++;
  beep(560,0.04,'sine',0.04);
  vibrate(5);
  updateSlideHUD(); renderSlide();
  if (isSlideSolved()) winSlide();
}
function isSlideSolved(){
  const board = slideState.board;
  const N = slideState.size*slideState.size;
  for (let i=0;i<N-1;i++) if (board[i]!==i+1) return false;
  return board[N-1]===0;
}
function updateSlideHUD(){
  const m = String(slideState.moves);
  if (m!==slideState.hudMovesCache){ $('#slideMoves').textContent = m; slideState.hudMovesCache = m; }
  const p = String(slideState.par);
  if (p!==slideState.hudParCache){ $('#slidePar').textContent = p; slideState.hudParCache = p; }
}
function startSlideLevel(level){
  stopAllGames();
  const cfg = getSlideConfig(level);
  slideState.level = level;
  slideState.size = cfg.size;
  slideState.par = cfg.scramble;
  const sc = slideScramble(cfg.size,cfg.scramble);
  slideState.board = sc.board; slideState.blank = sc.blank;
  slideState.moves = 0; slideState.active = true; slideState.solved = false;
  slideState.hudMovesCache = null; slideState.hudParCache = null; slideState.hudTimeCache = '';
  slideState.tileEls = [];
  showScreen('slide');
  $('#slideLevelChip').textContent = t('levelN',{n:level});
  renderSlide(); updateSlideHUD();
  $('#slideTime').textContent = '0:00';
  clearInterval(slideState.timerId);
  slideState.startTime = Date.now();
  slideState.timerId = setInterval(function(){
    if (!slideState.active) return;
    const elapsed = Math.floor((Date.now()-slideState.startTime)/1000);
    const m = Math.floor(elapsed/60), s = elapsed%60;
    const str = m+':'+(s<10?'0':'')+s;
    if (str!==slideState.hudTimeCache){ $('#slideTime').textContent = str; slideState.hudTimeCache = str; }
  }, 250);
}
function winSlide(){
  slideState.active = false; slideState.solved = true;
  clearInterval(slideState.timerId); slideState.timerId = null;
  const elapsed = Math.floor((Date.now()-slideState.startTime)/1000);
  const ratio = slideState.moves/Math.max(1,slideState.par);
  const stars = ratio<=1.4?3:ratio<=2.2?2:1;
  const gained = 50+stars*40+Math.max(0,120-Math.floor(elapsed/2));
  state.slide.score += gained;
  state.slide.unlocked = Math.max(state.slide.unlocked, Math.min(SLIDE_TOTAL, slideState.level+1));
  save(); updateHome();
  beep(880,0.09,'sine',0.08);
  setTimeout(function(){ beep(1568,0.16,'sine',0.07); }, 185);
  vibrate(20);
  const isFinal = slideState.level>=SLIDE_TOTAL;
  const title = isFinal?t('allClear'):stars===3?t('perfect'):stars===2?t('great'):t('good');
  openOverlay({icon:stars===3?'🌟':isFinal?'🏆':'🎉',title,
    sub:t('slideMovesResult',{m:slideState.moves,p:slideState.par})+' · +'+gained,
    stars,enterToNext:!isFinal,
    primary:isFinal?{label:t('levelsTitle'),fn:function(){closeOverlay();openSlideLevels();}}
      :{label:t('next'),fn:function(){closeOverlay();startSlideLevel(slideState.level+1);}},
    secondary:{label:t('retry'),fn:function(){closeOverlay();startSlideLevel(slideState.level);}}});
}

/* ========== 射击 ========== */
const SHOOT_SIZE = 400;
const shootState = { canvas:null,ctx:null,dpr:1,level:1,targets:[],particles:[],shockwaves:[],bulletHoles:[],
  shotsLeft:0,targetCount:0,hits:0,shotsFired:0,active:false,aimX:-999,aimY:-999,showAim:false,
  lastTs:0,rafId:null,shake:0,flash:0,bgCanvas:null,stars:null,lastShotTime:0 };
function getShootConfig(lv){
  const t01 = Math.min(1,(lv-1)/299);
  const targetCount = Math.min(10, 3+Math.floor(lv/35));
  const radius = 44-t01*22;
  const speed = 30+t01*140;
  const extraAmmo = Math.max(2, Math.round(6-t01*4));
  return {targetCount,radius,speed,ammo:targetCount+extraAmmo};
}
function generateShootStars(){
  shootState.stars = [];
  for (let i=0;i<70;i++) shootState.stars.push({x:Math.random()*SHOOT_SIZE,y:Math.random()*SHOOT_SIZE,r:Math.random()*1.4+0.3,a:Math.random()*0.4+0.15});
}
function renderShootBg(){
  if (!shootState.bgCanvas) shootState.bgCanvas = document.createElement('canvas');
  const bg = shootState.bgCanvas;
  bg.width = 800; bg.height = 800;
  const c = bg.getContext('2d');
  c.setTransform(2,0,0,2,0,0);
  c.fillStyle = '#080812'; c.fillRect(0,0,SHOOT_SIZE,SHOOT_SIZE);
  const grad = c.createRadialGradient(SHOOT_SIZE*0.5,SHOOT_SIZE*0.4,0,SHOOT_SIZE*0.5,SHOOT_SIZE*0.4,SHOOT_SIZE*0.75);
  grad.addColorStop(0,'rgba(80,60,180,0.22)');
  grad.addColorStop(0.55,'rgba(20,20,60,0.08)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = grad; c.fillRect(0,0,SHOOT_SIZE,SHOOT_SIZE);
  for (const s of shootState.stars){
    c.fillStyle = 'rgba(255,255,255,'+s.a+')';
    c.beginPath(); c.arc(s.x,s.y,s.r,0,Math.PI*2); c.fill();
  }
  c.strokeStyle = 'rgba(255,255,255,0.025)'; c.lineWidth = 0.6;
  for (let x=40;x<SHOOT_SIZE;x+=40){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,SHOOT_SIZE); c.stroke(); }
  for (let y=40;y<SHOOT_SIZE;y+=40){ c.beginPath(); c.moveTo(0,y); c.lineTo(SHOOT_SIZE,y); c.stroke(); }
}
function initShootCanvas(){
  const c = $('#shootCanvas');
  shootState.canvas = c;
  shootState.ctx = c.getContext('2d',{alpha:false});
  c.width = 800; c.height = 800;
  shootState.ctx.setTransform(2,0,0,2,0,0);
  if (!shootState.stars) generateShootStars();
  renderShootBg();
}
function spawnShootTarget(cfg){
  const r = cfg.radius;
  let x = 0, y = 0, attempts = 0;
  while (attempts<60){
    attempts++;
    x = r+12+Math.random()*(SHOOT_SIZE-2*r-24);
    y = r+12+Math.random()*(SHOOT_SIZE-2*r-24);
    let ok = true;
    for (const t of shootState.targets) if (Math.hypot(t.x-x,t.y-y)<t.r+r+14){ ok = false; break; }
    if (ok) break;
  }
  const angle = Math.random()*Math.PI*2;
  const speed = cfg.speed*(0.7+Math.random()*0.7);
  shootState.targets.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r,
    hue:Math.floor(Math.random()*360),wobble:Math.random()*Math.PI*2,age:0});
}
function startShootLevel(level){
  stopAllGames();
  const cfg = getShootConfig(level);
  shootState.level = level;
  shootState.targets = []; shootState.particles = []; shootState.shockwaves = []; shootState.bulletHoles = [];
  shootState.shotsLeft = cfg.ammo; shootState.targetCount = cfg.targetCount;
  shootState.hits = 0; shootState.shotsFired = 0;
  shootState.active = true;
  shootState.aimX = -999; shootState.aimY = -999; shootState.showAim = false;
  shootState.shake = 0; shootState.flash = 0; shootState.lastShotTime = 0;
  for (let i=0;i<cfg.targetCount;i++) spawnShootTarget(cfg);
  showScreen('shoot');
  $('#shootLevelChip').textContent = t('levelN',{n:level});
  initShootCanvas(); updateShootHUD();
  if (shootState.rafId) cancelAnimationFrame(shootState.rafId);
  shootState.lastTs = 0;
  shootState.rafId = requestAnimationFrame(shootLoop);
}
function updateShootHUD(){
  $('#shootHits').textContent = shootState.hits+'/'+shootState.targetCount;
  const ammoEl = $('#shootAmmo');
  ammoEl.textContent = shootState.shotsLeft;
  ammoEl.className = 'shoot-stat-value'+(shootState.shotsLeft<=2?' danger':shootState.shotsLeft<=4?' warn':'');
  let acc = 100;
  if (shootState.shotsFired>0) acc = Math.round(shootState.hits/shootState.shotsFired*100);
  $('#shootAcc').textContent = acc+'%';
}
function shootLoop(ts){
  if (!shootState.active) return;
  if (!shootState.lastTs) shootState.lastTs = ts;
  let dt = (ts-shootState.lastTs)/1000;
  shootState.lastTs = ts;
  if (dt>0.05) dt = 0.05;
  if (dt<0) dt = 0;
  updateShoot(dt); renderShoot();
  if (shootState.active) shootState.rafId = requestAnimationFrame(shootLoop);
}
function updateShoot(dt){
  for (const t of shootState.targets){
    t.x += t.vx*dt; t.y += t.vy*dt;
    if (t.x-t.r<0){ t.x = t.r; t.vx = Math.abs(t.vx); }
    else if (t.x+t.r>SHOOT_SIZE){ t.x = SHOOT_SIZE-t.r; t.vx = -Math.abs(t.vx); }
    if (t.y-t.r<0){ t.y = t.r; t.vy = Math.abs(t.vy); }
    else if (t.y+t.r>SHOOT_SIZE){ t.y = SHOOT_SIZE-t.r; t.vy = -Math.abs(t.vy); }
    t.wobble += dt*4; t.age += dt;
  }
  const ps = shootState.particles;
  for (let i=ps.length-1;i>=0;i--){
    const p = ps[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if (p.life<=0) ps.splice(i,1);
  }
  const ws = shootState.shockwaves;
  for (let i=ws.length-1;i>=0;i--){
    const w = ws[i];
    w.r += w.maxR/w.maxLife*dt*1.4;
    w.life -= dt;
    if (w.life<=0) ws.splice(i,1);
  }
  const bhs = shootState.bulletHoles;
  for (let i=bhs.length-1;i>=0;i--){
    bhs[i].life -= dt;
    if (bhs[i].life<=0) bhs.splice(i,1);
  }
  shootState.shake *= Math.exp(-10*dt);
  if (shootState.shake<0.15) shootState.shake = 0;
  shootState.flash *= Math.exp(-14*dt);
  if (shootState.flash<0.02) shootState.flash = 0;
}
function renderShoot(){
  const ctx = shootState.ctx;
  if (!ctx) return;
  if (!shootState.bgCanvas) renderShootBg();
  ctx.drawImage(shootState.bgCanvas,0,0,SHOOT_SIZE,SHOOT_SIZE);
  ctx.save();
  if (shootState.shake>0.1) ctx.translate((Math.random()-0.5)*shootState.shake,(Math.random()-0.5)*shootState.shake);
  for (const b of shootState.bulletHoles){
    const a = Math.min(1,b.life/0.8);
    ctx.fillStyle = 'rgba(0,0,0,'+(a*0.6)+')';
    ctx.beginPath(); ctx.arc(b.x,b.y,3.5,0,Math.PI*2); ctx.fill();
  }
  for (const w of shootState.shockwaves){
    const a = w.life/w.maxLife;
    ctx.strokeStyle = 'hsla('+w.hue+',95%,72%,'+(a*0.85)+')';
    ctx.lineWidth = 2.5*a;
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2); ctx.stroke();
  }
  for (const t of shootState.targets){
    const wob = 1+Math.sin(t.wobble)*0.06;
    const r = t.r*wob, x = t.x, y = t.y, hue = t.hue;
    const glow = ctx.createRadialGradient(x,y,r*0.4,x,y,r*1.9);
    glow.addColorStop(0,'hsla('+hue+',95%,65%,0.42)');
    glow.addColorStop(0.55,'hsla('+hue+',90%,55%,0.18)');
    glow.addColorStop(1,'hsla('+hue+',90%,55%,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x,y,r*1.9,0,Math.PI*2); ctx.fill();
    const inner = ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
    inner.addColorStop(0,'hsla('+hue+',85%,78%,0.55)');
    inner.addColorStop(0.7,'hsla('+hue+',80%,55%,0.32)');
    inner.addColorStop(1,'hsla('+hue+',80%,45%,0.15)');
    ctx.fillStyle = inner;
    ctx.beginPath(); ctx.arc(x,y,r*0.92,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'hsla('+hue+',95%,72%,0.95)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'hsla('+hue+',100%,92%,0.95)';
    ctx.beginPath(); ctx.arc(x,y,r*0.22,0,Math.PI*2); ctx.fill();
  }
  for (const p of shootState.particles){
    const a = p.life/p.maxLife;
    ctx.fillStyle = 'hsla('+p.hue+',95%,72%,'+a+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a+0.6,0,Math.PI*2); ctx.fill();
  }
  if (shootState.showAim && shootState.aimX>-100){
    const x = shootState.aimX, y = shootState.aimY;
    ctx.strokeStyle = 'rgba(0,240,220,0.85)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x-18,y); ctx.lineTo(x-7,y);
    ctx.moveTo(x+7,y); ctx.lineTo(x+18,y);
    ctx.moveTo(x,y-18); ctx.lineTo(x,y-7);
    ctx.moveTo(x,y+7); ctx.lineTo(x,y+18);
    ctx.stroke();
  }
  ctx.restore();
  if (shootState.flash>0.02){
    ctx.fillStyle = 'rgba(180,200,255,'+(shootState.flash*0.25)+')';
    ctx.fillRect(0,0,SHOOT_SIZE,SHOOT_SIZE);
  }
}
function playShootSound(){
  if (!state.sound) return;
  try{
    const ctx = getCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(1400,now);
    o.frequency.exponentialRampToValueAtTime(180,now+0.08);
    g.gain.setValueAtTime(0.075,now);
    g.gain.exponentialRampToValueAtTime(0.0001,now+0.1);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now+0.12);
    noiseBurst(0.045,0.045,2400,7000);
  }catch(e){}
}
function shootAt(px,py){
  if (!shootState.active) return;
  if (shootState.shotsLeft<=0) return;
  const now = performance.now();
  if (now-shootState.lastShotTime<70) return;
  shootState.lastShotTime = now;
  shootState.shotsLeft--; shootState.shotsFired++;
  shootState.shake = 7; shootState.flash = 0.65;
  let hitTarget = null, bestDist = Infinity;
  for (const t of shootState.targets){
    const d = Math.hypot(t.x-px,t.y-py);
    if (d<=t.r && d<bestDist){ bestDist = d; hitTarget = t; }
  }
  if (hitTarget){
    for (let i=0;i<14;i++){
      const ang = (i/14)*Math.PI*2+Math.random()*0.35;
      const spd = 90+Math.random()*180;
      shootState.particles.push({x:hitTarget.x,y:hitTarget.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
        life:0.5+Math.random()*0.35,maxLife:0.85,size:2+Math.random()*2.6,hue:hitTarget.hue});
    }
    shootState.shockwaves.push({x:hitTarget.x,y:hitTarget.y,r:4,maxR:62,life:0.45,maxLife:0.45,hue:hitTarget.hue});
    const idx = shootState.targets.indexOf(hitTarget);
    if (idx>=0) shootState.targets.splice(idx,1);
    shootState.hits++;
    beep(920,0.06,'sine',0.08);
    setTimeout(function(){ beep(1380,0.1,'sine',0.07); }, 45);
    vibrate(12);
  } else {
    shootState.bulletHoles.push({x:px,y:py,life:1.6});
    playShootSound(); vibrate(4);
  }
  updateShootHUD();
  if (shootState.targets.length===0) winShoot();
  else if (shootState.shotsLeft<=0) loseShoot();
}
function winShoot(){
  if (!shootState.active) return;
  shootState.active = false;
  if (shootState.rafId){ cancelAnimationFrame(shootState.rafId); shootState.rafId = null; }
  const accuracy = shootState.shotsFired>0?shootState.hits/shootState.shotsFired:1;
  const stars = accuracy>=0.7?3:accuracy>=0.5?2:1;
  const gained = 70+stars*40+Math.round(accuracy*100);
  state.shoot.score += gained;
  state.shoot.unlocked = Math.max(state.shoot.unlocked, Math.min(SHOOT_TOTAL, shootState.level+1));
  save(); updateHome();
  beep(880,0.09,'sine',0.08);
  setTimeout(function(){ beep(1568,0.16,'sine',0.07); }, 185);
  vibrate(20);
  const isFinal = shootState.level>=SHOOT_TOTAL;
  const title = isFinal?t('allClear'):stars===3?t('perfect'):stars===2?t('great'):t('good');
  openOverlay({icon:stars===3?'🌟':isFinal?'🏆':'🎯',title,
    sub:t('shootResult',{h:shootState.hits,s:shootState.shotsFired})+' · +'+gained,
    stars,enterToNext:!isFinal,
    primary:isFinal?{label:t('levelsTitle'),fn:function(){closeOverlay();openShootLevels();}}
      :{label:t('next'),fn:function(){closeOverlay();startShootLevel(shootState.level+1);}},
    secondary:{label:t('retry'),fn:function(){closeOverlay();startShootLevel(shootState.level);}}});
}
function loseShoot(){
  if (!shootState.active) return;
  shootState.active = false;
  if (shootState.rafId){ cancelAnimationFrame(shootState.rafId); shootState.rafId = null; }
  beep(220,0.18,'sawtooth',0.055);
  vibrate([40,60,40]);
  openOverlay({icon:'💥',title:t('shootFail'),sub:t('shootResult',{h:shootState.hits,s:shootState.shotsFired}),
    stars:0,enterToNext:false,
    primary:{label:t('retry'),fn:function(){closeOverlay();startShootLevel(shootState.level);}},
    secondary:{label:t('levelsTitle'),fn:function(){closeOverlay();openShootLevels();}}});
}

/* ========== 贪吃蛇 ========== */
const snakeState = { mode:'endless',cols:20,rows:20,snake:[],dir:{x:1,y:0},dirQueue:[],
  food:null,obstacles:[],score:0,speed:160,intervalId:null,running:false,cellEls:[],boardBuilt:false };
function initSnakeGame(mode){
  snakeState.mode = mode;
  if (mode==='endless'){ snakeState.cols = 20; snakeState.rows = 20; snakeState.speed = 160; }
  else if (mode==='survival'){ snakeState.cols = 16; snakeState.rows = 16; snakeState.speed = 145; }
  else { snakeState.cols = 18; snakeState.rows = 18; snakeState.speed = 150; }
  const cx = Math.floor(snakeState.cols/2), cy = Math.floor(snakeState.rows/2);
  snakeState.snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  snakeState.dir = {x:1,y:0}; snakeState.dirQueue = [];
  snakeState.score = 0; snakeState.obstacles = []; snakeState.food = null;
  snakeState.boardBuilt = false; snakeState.cellEls = [];
  placeSnakeFood(); buildSnakeBoard(); renderSnake(); updateSnakeStat();
  snakeState.running = true;
  restartSnakeInterval();
}
function buildSnakeBoard(){
  const W = snakeState.cols, H = snakeState.rows;
  const board = $('#snakeBoard');
  board.className = 'snake-board'+(snakeState.mode==='immortal'?' immortal':'');
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${W},1fr)`;
  board.style.gridTemplateRows = `repeat(${H},1fr)`;
  const els = [];
  for (let i=0;i<W*H;i++){ const el = document.createElement('div'); el.className = 'snake-cell'; board.appendChild(el); els.push(el); }
  snakeState.cellEls = els; snakeState.boardBuilt = true;
}
function placeSnakeFood(){
  const W = snakeState.cols, H = snakeState.rows;
  const occupied = new Set();
  for (const s of snakeState.snake) occupied.add(s.y*W+s.x);
  for (const o of snakeState.obstacles) occupied.add(o.y*W+o.x);
  const free = [];
  for (let i=0;i<W*H;i++) if (!occupied.has(i)) free.push(i);
  if (!free.length){ snakeDie(); return; }
  const pick = free[Math.floor(Math.random()*free.length)];
  snakeState.food = {x:pick%W,y:Math.floor(pick/W)};
}
function spawnObstacle(){
  const W = snakeState.cols, H = snakeState.rows;
  const occupied = new Set();
  for (const s of snakeState.snake) occupied.add(s.y*W+s.x);
  for (const o of snakeState.obstacles) occupied.add(o.y*W+o.x);
  if (snakeState.food) occupied.add(snakeState.food.y*W+snakeState.food.x);
  const free = [];
  for (let i=0;i<W*H;i++) if (!occupied.has(i)) free.push(i);
  if (free.length<8) return;
  const pick = free[Math.floor(Math.random()*free.length)];
  snakeState.obstacles.push({x:pick%W,y:Math.floor(pick/W)});
}
function restartSnakeInterval(){
  if (snakeState.intervalId) clearInterval(snakeState.intervalId);
  if (!snakeState.running) return;
  snakeState.intervalId = setInterval(snakeTick, snakeState.speed);
}
function renderSnake(){
  if (!snakeState.boardBuilt) return;
  const W = snakeState.cols;
  const els = snakeState.cellEls;
  for (let i=0;i<els.length;i++) if (els[i].className!=='snake-cell') els[i].className = 'snake-cell';
  for (const o of snakeState.obstacles){ const el = els[o.y*W+o.x]; if (el) el.classList.add('obstacle'); }
  if (snakeState.food){ const el = els[snakeState.food.y*W+snakeState.food.x]; if (el) el.classList.add('food'); }
  for (let i=snakeState.snake.length-1;i>=0;i--){
    const s = snakeState.snake[i];
    const el = els[s.y*W+s.x];
    if (el) el.classList.add(i===0?'head':'body');
  }
}
function updateSnakeStat(){
  const modeLabel = snakeState.mode==='endless'?t('endlessMode'):snakeState.mode==='survival'?t('survivalMode'):t('immortalMode');
  const best = snakeState.mode==='endless'?state.snake.bestEndless:snakeState.mode==='survival'?state.snake.bestSurvival:state.snake.bestImmortal;
  $('#snakeStat').innerHTML = modeLabel+'<br><b>'+t('best')+': '+best+'</b>';
  $('#snakeScoreChip').textContent = snakeState.score;
}
function snakeTick(){
  if (!snakeState.running) return;
  if (snakeState.dirQueue.length){
    const nxt = snakeState.dirQueue.shift();
    const cur = snakeState.dir;
    if (!(nxt.x===-cur.x && nxt.y===-cur.y)) snakeState.dir = nxt;
  }
  const head = snakeState.snake[0];
  let nx = head.x+snakeState.dir.x;
  let ny = head.y+snakeState.dir.y;
  const immortal = snakeState.mode==='immortal';
  if (immortal){
    if (nx<0) nx = snakeState.cols-1; else if (nx>=snakeState.cols) nx = 0;
    if (ny<0) ny = snakeState.rows-1; else if (ny>=snakeState.rows) ny = 0;
  } else {
    if (nx<0||nx>=snakeState.cols||ny<0||ny>=snakeState.rows){ snakeDie(); return; }
  }
  const willEat = snakeState.food && snakeState.food.x===nx && snakeState.food.y===ny;
  const checkLen = willEat?snakeState.snake.length:snakeState.snake.length-1;
  if (!immortal){
    for (let i=0;i<checkLen;i++) if (snakeState.snake[i].x===nx && snakeState.snake[i].y===ny){ snakeDie(); return; }
  }
  if (!immortal){
    for (const o of snakeState.obstacles) if (o.x===nx && o.y===ny){ snakeDie(); return; }
  }
  snakeState.snake.unshift({x:nx,y:ny});
  if (!willEat) snakeState.snake.pop();
  if (willEat){
    snakeState.score++;
    snakeState.speed = Math.max(55, snakeState.speed-3);
    if (snakeState.mode==='survival' && snakeState.score%3===0) spawnObstacle();
    placeSnakeFood(); restartSnakeInterval();
    beep(880,0.06,'sine',0.06);
    vibrate(8);
  }
  renderSnake(); updateSnakeStat();
}
function setSnakeDir(dx,dy){
  if (!snakeState.running) return;
  const last = snakeState.dirQueue.length?snakeState.dirQueue[snakeState.dirQueue.length-1]:snakeState.dir;
  if (last.x===-dx && last.y===-dy) return;
  if (last.x===dx && last.y===dy) return;
  if (snakeState.dirQueue.length<2) snakeState.dirQueue.push({x:dx,y:dy});
}
function snakeDie(){
  if (!snakeState.running) return;
  snakeState.running = false;
  if (snakeState.intervalId){ clearInterval(snakeState.intervalId); snakeState.intervalId = null; }
  if (snakeState.mode==='endless'){
    if (snakeState.score>state.snake.bestEndless){ state.snake.bestEndless = snakeState.score; save(); }
  } else if (snakeState.mode==='survival'){
    if (snakeState.score>state.snake.bestSurvival){ state.snake.bestSurvival = snakeState.score; save(); }
  } else {
    if (snakeState.score>state.snake.bestImmortal){ state.snake.bestImmortal = snakeState.score; save(); }
  }
  updateSnakeStat();
  beep(220,0.2,'sawtooth',0.06);
  vibrate([50,60,50]);
  openOverlay({icon:'💀',title:t('gameOver'),sub:t('scoreNum',{n:snakeState.score}),stars:0,enterToNext:false,
    primary:{label:t('retry'),fn:function(){closeOverlay();startSnake(snakeState.mode);}},
    secondary:{label:t('backToMenu'),fn:function(){closeOverlay();openSnakeMenu();}}});
}
function startSnake(mode){
  stopAllGames();
  showScreen('snake');
  initSnakeGame(mode);
}
function openSnakeMenu(){
  stopAllGames();
  showScreen('snake-menu');
  updateHome();
}

/* ========== 弹珠 ========== */
const PINBALL_TIME = 30, PINBALL_BALL_LIFE = 6.5, PINBALL_BALL_R = 7, PINBALL_MAX_BALLS = 15, PINBALL_SHOOT_SPEED = 560;
const pinballState = { canvas:null,ctx:null,W:400,H:400,dpr:1,balls:[],bumpers:[],particles:[],floatTexts:[],
  score:0,timeLeft:PINBALL_TIME,active:false,lastTs:0,rafId:null,shootCooldown:0,aimX:0,aimY:0,aimTimer:0,
  bgCanvas:null,bgW:0,bgH:0,bgDpr:1,hudTimeCache:'',hudScoreCache:null,hudBestCache:null,hudUrgent:false };
function initPinballCanvas(){
  const c = $('#pinballCanvas');
  pinballState.canvas = c;
  pinballState.ctx = c.getContext('2d',{alpha:false});
  resizePinballCanvas();
}
function resizePinballCanvas(){
  const c = pinballState.canvas;
  if (!c) return;
  const rect = c.getBoundingClientRect();
  const w = Math.round(rect.width), h = Math.round(rect.height);
  if (!w||!h) return;
  const dpr = Math.min(window.devicePixelRatio||1,2);
  c.width = w*dpr; c.height = h*dpr;
  pinballState.dpr = dpr;
  pinballState.W = w; pinballState.H = h;
  pinballState.ctx.setTransform(dpr,0,0,dpr,0,0);
  if (!pinballState.active) buildBumpers();
  pinballState.bgCanvas = null;
}
function buildBumpers(){
  const W = pinballState.W, H = pinballState.H;
  if (!W||!H) return;
  const size = Math.min(W,H);
  const layout = [
    {rx:0.50,ry:0.17,rr:0.085,val:5},{rx:0.20,ry:0.33,rr:0.070,val:3},{rx:0.80,ry:0.33,rr:0.070,val:3},
    {rx:0.50,ry:0.46,rr:0.080,val:5},{rx:0.11,ry:0.58,rr:0.062,val:2},{rx:0.89,ry:0.58,rr:0.062,val:2},
    {rx:0.32,ry:0.74,rr:0.060,val:2},{rx:0.68,ry:0.74,rr:0.060,val:2}
  ];
  pinballState.bumpers = layout.map(function(it,i){
    return {x:it.rx*W,y:it.ry*H,r:it.rr*size,value:it.val,cooldown:0,hue:(i*47+200)%360};
  });
}
function renderPinballBg(){
  const W = pinballState.W, H = pinballState.H, dpr = pinballState.dpr;
  if (!W||!H) return;
  if (!pinballState.bgCanvas) pinballState.bgCanvas = document.createElement('canvas');
  const bg = pinballState.bgCanvas;
  if (bg.width!==W*dpr||bg.height!==H*dpr){ bg.width = W*dpr; bg.height = H*dpr; }
  const c = bg.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle = '#0a0a16'; c.fillRect(0,0,W,H);
  const g = c.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,Math.max(W,H)*0.72);
  g.addColorStop(0,'rgba(124,92,255,0.12)');
  g.addColorStop(0.6,'rgba(0,224,198,0.04)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0,0,W,H);
  c.fillStyle = 'rgba(255,255,255,0.035)';
  const gridStep = Math.max(24, Math.round(Math.min(W,H)/16));
  for (let x=gridStep/2;x<W;x+=gridStep) for (let y=gridStep/2;y<H;y+=gridStep) c.fillRect(x-1,y-1,2,2);
  pinballState.bgW = W; pinballState.bgH = H; pinballState.bgDpr = dpr;
}
function startPinball(){
  stopAllGames();
  showScreen('pinball');
  initPinballCanvas();
  pinballState.score = 0; pinballState.timeLeft = PINBALL_TIME;
  pinballState.balls = []; pinballState.particles = []; pinballState.floatTexts = [];
  pinballState.active = true; pinballState.lastTs = 0;
  pinballState.shootCooldown = 0; pinballState.aimTimer = 0;
  pinballState.hudTimeCache = ''; pinballState.hudScoreCache = null; pinballState.hudBestCache = null; pinballState.hudUrgent = false;
  buildBumpers(); renderPinballBg(); updatePinballHUD();
  if (pinballState.rafId) cancelAnimationFrame(pinballState.rafId);
  pinballState.rafId = requestAnimationFrame(pinballLoop);
}
function updatePinballHUD(){
  const scoreStr = String(pinballState.score);
  if (scoreStr!==pinballState.hudScoreCache){ $('#pinballScoreChip').textContent = scoreStr; pinballState.hudScoreCache = scoreStr; }
  const best = state.pinball.best||0;
  if (best!==pinballState.hudBestCache){ $('#pinballBest').textContent = t('best')+': '+best; pinballState.hudBestCache = best; }
  const timeStr = pinballState.timeLeft.toFixed(1)+'s';
  if (timeStr!==pinballState.hudTimeCache){ $('#pinballTime').textContent = timeStr; pinballState.hudTimeCache = timeStr; }
  const urgent = pinballState.timeLeft<=5;
  if (urgent!==pinballState.hudUrgent){ $('#pinballTime').classList.toggle('urgent',urgent); pinballState.hudUrgent = urgent; }
}
function pinballLoop(ts){
  if (!pinballState.active) return;
  if (!pinballState.lastTs) pinballState.lastTs = ts;
  let dt = (ts-pinballState.lastTs)/1000;
  pinballState.lastTs = ts;
  if (dt>0.05) dt = 0.05;
  if (dt<0) dt = 0;
  updatePinball(dt); renderPinball();
  if (pinballState.active) pinballState.rafId = requestAnimationFrame(pinballLoop);
}
function updatePinball(dt){
  pinballState.timeLeft -= dt;
  if (pinballState.timeLeft<=0){ pinballState.timeLeft = 0; updatePinballHUD(); endPinball(); return; }
  if (pinballState.shootCooldown>0) pinballState.shootCooldown -= dt;
  if (pinballState.aimTimer>0) pinballState.aimTimer -= dt;
  for (const b of pinballState.bumpers) if (b.cooldown>0) b.cooldown -= dt;
  for (let s=0;s<2;s++) stepPinballPhysics(dt/2);
  const balls = pinballState.balls;
  for (let i=balls.length-1;i>=0;i--){
    const b = balls[i];
    b.life -= dt;
    const sp = Math.hypot(b.vx,b.vy);
    if (b.life<=0||(sp<45&&b.age>0.5)){ balls.splice(i,1); continue; }
    b.age += dt; b.trailTimer += dt;
    if (b.trailTimer>0.02){ b.trailTimer = 0; b.trail.push({x:b.x,y:b.y}); if (b.trail.length>6) b.trail.shift(); }
  }
  const ps = pinballState.particles;
  for (let i=ps.length-1;i>=0;i--){
    const p = ps[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.93; p.vy *= 0.93;
    p.life -= dt;
    if (p.life<=0) ps.splice(i,1);
  }
  const ts = pinballState.floatTexts;
  for (let i=ts.length-1;i>=0;i--){
    ts[i].y -= 32*dt; ts[i].life -= dt;
    if (ts[i].life<=0) ts.splice(i,1);
  }
  updatePinballHUD();
}
function stepPinballPhysics(dt){
  const W = pinballState.W, H = pinballState.H;
  const bumpers = pinballState.bumpers, balls = pinballState.balls;
  const R = PINBALL_BALL_R;
  for (const ball of balls){
    const fric = Math.exp(-0.9*dt);
    ball.vx *= fric; ball.vy *= fric;
    ball.x += ball.vx*dt; ball.y += ball.vy*dt;
    if (ball.x-R<0){ ball.x = R; ball.vx = Math.abs(ball.vx)*0.92; }
    else if (ball.x+R>W){ ball.x = W-R; ball.vx = -Math.abs(ball.vx)*0.92; }
    if (ball.y-R<0){ ball.y = R; ball.vy = Math.abs(ball.vy)*0.92; }
    else if (ball.y+R>H){ ball.y = H-R; ball.vy = -Math.abs(ball.vy)*0.92; }
    for (const b of bumpers){
      const dx = ball.x-b.x, dy = ball.y-b.y;
      const dist = Math.hypot(dx,dy);
      const minDist = R+b.r;
      if (dist<minDist && dist>0.0001){
        const nx = dx/dist, ny = dy/dist;
        const overlap = minDist-dist;
        ball.x += nx*overlap; ball.y += ny*overlap;
        const dot = ball.vx*nx+ball.vy*ny;
        ball.vx -= 2*dot*nx; ball.vy -= 2*dot*ny;
        ball.vx *= 1.16; ball.vy *= 1.16;
        const sp = Math.hypot(ball.vx,ball.vy);
        if (sp>900){ ball.vx = ball.vx/sp*900; ball.vy = ball.vy/sp*900; }
        if (b.cooldown<=0){
          b.cooldown = 0.35;
          pinballState.score += b.value;
          for (let i=0;i<8;i++){
            const ang = (i/8)*Math.PI*2+Math.random()*0.4;
            const spd = 70+Math.random()*130;
            pinballState.particles.push({x:b.x,y:b.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
              life:0.45+Math.random()*0.3,maxLife:0.75,size:1.8+Math.random()*2.4,hue:b.hue});
          }
          pinballState.floatTexts.push({x:b.x,y:b.y-b.r-6,text:'+'+b.value,life:0.7,maxLife:0.7,hue:b.hue});
          beep(760+Math.random()*480,0.055,'sine',0.05);
        }
      }
    }
  }
}
function renderPinball(){
  const ctx = pinballState.ctx;
  if (!ctx) return;
  const W = pinballState.W, H = pinballState.H;
  const bumpers = pinballState.bumpers, balls = pinballState.balls;
  const particles = pinballState.particles, floatTexts = pinballState.floatTexts;
  if (!pinballState.bgCanvas||pinballState.bgW!==W||pinballState.bgH!==H||pinballState.bgDpr!==pinballState.dpr) renderPinballBg();
  ctx.drawImage(pinballState.bgCanvas,0,0,W,H);
  for (const b of bumpers){
    const cd = Math.max(0,b.cooldown/0.35);
    const scale = 1+cd*0.28, alpha = 0.9-cd*0.25;
    const r = b.r*scale;
    const glow = ctx.createRadialGradient(b.x,b.y,r*0.3,b.x,b.y,r*2.1);
    glow.addColorStop(0,'hsla('+b.hue+',100%,68%,'+(0.45*alpha)+')');
    glow.addColorStop(1,'hsla('+b.hue+',100%,60%,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(b.x,b.y,r*2.1,0,Math.PI*2); ctx.fill();
    const body = ctx.createRadialGradient(b.x-r*0.32,b.y-r*0.32,r*0.15,b.x,b.y,r);
    body.addColorStop(0,'hsla('+b.hue+',95%,84%,'+alpha+')');
    body.addColorStop(0.62,'hsla('+b.hue+',88%,62%,'+alpha+')');
    body.addColorStop(1,'hsla('+b.hue+',75%,44%,'+(alpha*0.9)+')');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(b.x,b.y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,'+(alpha*0.95)+')';
    ctx.font = '900 '+Math.round(r*0.9)+'px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.value,b.x,b.y+1);
  }
  for (const p of particles){
    const a = p.life/p.maxLife;
    ctx.fillStyle = 'hsla('+p.hue+',90%,72%,'+a+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2); ctx.fill();
  }
  for (const ball of balls){
    const lifeR = Math.min(1,ball.life/0.7);
    if (ball.trail.length){
      for (let i=0;i<ball.trail.length;i++){
        const tPt = ball.trail[i];
        const ta = (i/ball.trail.length)*0.35*lifeR;
        ctx.fillStyle = 'rgba(140,220,255,'+ta+')';
        ctx.beginPath(); ctx.arc(tPt.x,tPt.y,PINBALL_BALL_R*0.55*(i/ball.trail.length),0,Math.PI*2); ctx.fill();
      }
    }
    const glow = ctx.createRadialGradient(ball.x,ball.y,1,ball.x,ball.y,PINBALL_BALL_R*2.8);
    glow.addColorStop(0,'rgba(200,240,255,'+(0.8*lifeR)+')');
    glow.addColorStop(0.5,'rgba(124,200,255,'+(0.3*lifeR)+')');
    glow.addColorStop(1,'rgba(124,200,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,PINBALL_BALL_R*2.8,0,Math.PI*2); ctx.fill();
    const ballG = ctx.createRadialGradient(ball.x-PINBALL_BALL_R*0.35,ball.y-PINBALL_BALL_R*0.35,0.5,ball.x,ball.y,PINBALL_BALL_R);
    ballG.addColorStop(0,'rgba(255,255,255,'+lifeR+')');
    ballG.addColorStop(0.55,'rgba(180,230,255,'+lifeR+')');
    ballG.addColorStop(1,'rgba(110,160,220,'+(lifeR*0.9)+')');
    ctx.fillStyle = ballG;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,PINBALL_BALL_R,0,Math.PI*2); ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floatTexts){
    const a = f.life/f.maxLife;
    ctx.font = '900 15px -apple-system,BlinkMacSystemFont,sans-serif';
    ctx.fillStyle = 'hsla('+f.hue+',100%,78%,'+a+')';
    ctx.fillText(f.text,f.x,f.y);
  }
  const sx = W/2, sy = H-26;
  const sg = ctx.createRadialGradient(sx,sy,1,sx,sy,18);
  sg.addColorStop(0,'rgba(255,255,255,0.65)');
  sg.addColorStop(1,'rgba(124,92,255,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx,sy,18,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#8b6dff';
  ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2); ctx.fill();
}
function shootPinball(tx,ty){
  if (!pinballState.active) return;
  if (pinballState.shootCooldown>0) return;
  if (pinballState.balls.length>=PINBALL_MAX_BALLS) return;
  const W = pinballState.W, H = pinballState.H;
  const sx = W/2, sy = H-26;
  const dx = tx-sx, dy = ty-sy;
  if (dy>-8) return;
  const dist = Math.hypot(dx,dy);
  if (dist<24) return;
  pinballState.balls.push({x:sx,y:sy,vx:(dx/dist)*PINBALL_SHOOT_SPEED,vy:(dy/dist)*PINBALL_SHOOT_SPEED,
    life:PINBALL_BALL_LIFE,age:0,trail:[],trailTimer:0});
  pinballState.shootCooldown = 0.10;
  pinballState.aimX = tx; pinballState.aimY = ty; pinballState.aimTimer = 0.4;
  beep(320+Math.random()*140,0.055,'square',0.04);
}
function endPinball(){
  if (!pinballState.active) return;
  pinballState.active = false;
  if (pinballState.rafId){ cancelAnimationFrame(pinballState.rafId); pinballState.rafId = null; }
  if (pinballState.score>(state.pinball.best||0)){ state.pinball.best = pinballState.score; save(); }
  updateHome(); updatePinballHUD();
  beep(880,0.1,'sine',0.08);
  vibrate(25);
  openOverlay({icon:'🎯',title:t('pinballEnd'),sub:t('scoreNum',{n:pinballState.score}),stars:0,enterToNext:false,
    primary:{label:t('retry'),fn:function(){closeOverlay();startPinball();}},
    secondary:{label:t('backToMenu'),fn:function(){closeOverlay();goHome();}}});
}

function playSynth(cfg){
  if (!state.sound || !cfg) return;
  try{
    const ctx = getCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    const r = cfg.r||1, gap = cfg.g||0.15, dur = cfg.d||0.2;
    const vol = cfg.vol!==undefined?cfg.vol:0.08;
    const attack = cfg.a!==undefined?cfg.a:0.01;
    for (let i=0;i<r;i++){
      const t0 = now+i*gap;
      if (cfg.f0){
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = cfg.w||'sine';
        o.frequency.setValueAtTime(cfg.f0,t0);
        if (cfg.f1!==undefined&&cfg.f1!==cfg.f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,cfg.f1),t0+dur);
        if (cfg.v){
          const lfo = ctx.createOscillator(); const lg = ctx.createGain();
          lfo.type='sine'; lfo.frequency.value = cfg.v;
          lg.gain.value = cfg.vd||(cfg.f0*0.06);
          lfo.connect(lg); lg.connect(o.frequency);
          lfo.start(t0); lfo.stop(t0+dur+0.06);
        }
        g.gain.setValueAtTime(0.0001,t0);
        g.gain.linearRampToValueAtTime(vol,t0+attack);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
        let node = o;
        if (cfg.lp){ const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = cfg.lp; node.connect(f); node=f; }
        if (cfg.hp){ const f = ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value = cfg.hp; node.connect(f); node=f; }
        node.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0+dur+0.06);
      }
      if (cfg.n){
        setTimeout(function(){ noiseBurst(dur*(cfg.nd||0.65), cfg.n*0.45, cfg.nhp||800, cfg.nlp||5000); }, i*gap*1000);
      }
    }
  }catch(e){}
}

/* 分页加载解压按钮 */
const relaxPage = { sound:0, animal:0 };
const PAGE_SIZE = 60;

function loadRelaxPage(type, reset){
  if (type==='sound'){
    if (reset){ relaxPage.sound = 0; $('#soundGrid').innerHTML = ''; $('#soundMore').innerHTML = ''; }
    const start = relaxPage.sound * PAGE_SIZE;
    const end = Math.min(start+PAGE_SIZE, SOUND_LIB.length);
    const grid = $('#soundGrid');
    const frag = document.createDocumentFragment();
    for (let i=start;i<end;i++){
      const item = SOUND_LIB[i];
      const b = document.createElement('button');
      b.className = 'sound-btn';
      b.innerHTML = '<span class="emoji">'+item.emoji+'</span><span>'+(state.lang==='zh'?item.zh:item.en)+'</span>';
      b.addEventListener('click', function(){
        playSynth(item.cfg);
        b.classList.add('playing');
        setTimeout(function(){ b.classList.remove('playing'); }, 320);
        vibrate(6);
      });
      frag.appendChild(b);
    }
    grid.appendChild(frag);
    relaxPage.sound++;
    updateMoreButton('sound', end < SOUND_LIB.length);
  } else if (type==='animal'){
    if (reset){ relaxPage.animal = 0; $('#animalGrid').innerHTML = ''; $('#animalMore').innerHTML = ''; }
    const start = relaxPage.animal * PAGE_SIZE;
    const end = Math.min(start+PAGE_SIZE, ANIMAL_LIB.length);
    const grid = $('#animalGrid');
    const frag = document.createDocumentFragment();
    for (let i=start;i<end;i++){
      const item = ANIMAL_LIB[i];
      const b = document.createElement('button');
      b.className = 'sound-btn';
      b.innerHTML = '<span class="emoji">'+item.emoji+'</span><span>'+(state.lang==='zh'?item.zh:item.en)+'</span>';
      b.addEventListener('click', function(){
        if (item.legacy){ try { playLegacyAnimal(item.id); }catch(e){} }
        else playSynth(item.cfg);
        b.classList.add('playing');
        setTimeout(function(){ b.classList.remove('playing'); }, 700);
        vibrate(6);
      });
      frag.appendChild(b);
    }
    grid.appendChild(frag);
    relaxPage.animal++;
    updateMoreButton('animal', end < ANIMAL_LIB.length);
  }
}
function updateMoreButton(type, hasMore){
  const wrap = $('#'+type+'More');
  if (!wrap) return;
  wrap.innerHTML = '';
  if (!hasMore) return;
  const btn = document.createElement('button');
  btn.className = 'load-more';
  btn.textContent = t('loadMore');
  btn.addEventListener('click', function(){ loadRelaxPage(type, false); });
  wrap.appendChild(btn);
}

let voiceList = [];
function refreshVoiceList(){
  if (!('speechSynthesis' in window)) return;
  voiceList = window.speechSynthesis.getVoices() || [];
}
if ('speechSynthesis' in window){
  refreshVoiceList();
  window.speechSynthesis.onvoiceschanged = refreshVoiceList;
}
function speakHello(item, btn){
  if (!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(item.text);
    u.lang = item.code; u.rate = 0.9; u.pitch = 1.05; u.volume = 1;
    if (voiceList.length){
      const base = item.code.split('-')[0].toLowerCase();
      const match = voiceList.find(function(v){ return v.lang.replace('_','-').toLowerCase().indexOf(base)===0; });
      if (match) u.voice = match;
    }
    if (btn){
      btn.classList.add('playing');
      const clear = function(){ btn.classList.remove('playing'); };
      u.onend = clear; u.onerror = clear;
      setTimeout(clear, 2200);
    }
    window.speechSynthesis.speak(u);
  }catch(e){ if (btn) btn.classList.remove('playing'); }
}

function buildLevelsInto(gridId, total, unlocked, onPick){
  const grid = document.getElementById(gridId);
  if (!grid) return;
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i=1;i<=total;i++){
    const b = document.createElement('button');
    const isUnlocked = i<=unlocked;
    b.className = 'lvl-btn'+(isUnlocked?(i<unlocked?' done':''):' locked');
    b.textContent = isUnlocked?i:'🔒';
    if (!isUnlocked) b.disabled = true;
    b.addEventListener('click', (function(n){ return function(){ closeOverlay(); onPick(n); }; })(i));
    frag.appendChild(b);
  }
  grid.appendChild(frag);
}
function scrollToCurrent(gridId, unlocked, total){
  setTimeout(function(){
    const grid = document.getElementById(gridId);
    if (!grid) return;
    const btns = grid.querySelectorAll('.lvl-btn');
    const target = btns[Math.min(unlocked,total)-1];
    if (target && target.scrollIntoView) target.scrollIntoView({block:'center'});
  }, 60);
}

/* ========== 输入绑定 ========== */
function attachSwipe(el, onSwipe){
  let start = null;
  el.addEventListener('touchstart', function(e){ const tt = e.touches[0]; start = {x:tt.clientX,y:tt.clientY}; }, {passive:true});
  el.addEventListener('touchend', function(e){
    if (!start) return;
    const tt = e.changedTouches[0];
    const dx = tt.clientX-start.x, dy = tt.clientY-start.y;
    start = null;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (Math.max(adx,ady)<22) return;
    if (adx>ady) onSwipe(dx>0?1:-1, 0);
    else onSwipe(0, dy>0?1:-1);
  }, {passive:true});
}
function bindMazeInput(){
  const board = $('#mazeBoard');
  let suppress = false;
  attachSwipe(board, function(dx,dy){ suppress = true; setTimeout(function(){ suppress = false; }, 380); tryMove(dx,dy); });
  board.addEventListener('click', function(e){
    if (suppress) return;
    const cellEl = e.target.closest('.maze-cell');
    if (!cellEl) return;
    const idx = mazeState.cellEls.indexOf(cellEl);
    if (idx<0) return;
    const cx = idx%mazeState.cols, cy = Math.floor(idx/mazeState.cols);
    const p = mazeState.player;
    const dx = cx-p.x, dy = cy-p.y;
    if (Math.abs(dx)+Math.abs(dy)===1) tryMove(dx,dy);
  });
}
function bindSokobanInput(){
  const board = $('#sokobanBoard');
  attachSwipe(board, function(dx,dy){ sokobanMove(dx,dy); });
  document.querySelectorAll('#screen-sokoban .dpad-btn').forEach(function(btn){
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      const dir = this.dataset.dir;
      if (dir==='up') sokobanMove(0,-1);
      else if (dir==='down') sokobanMove(0,1);
      else if (dir==='left') sokobanMove(-1,0);
      else if (dir==='right') sokobanMove(1,0);
    });
  });
}

}
function bindMatchInput(){
  const board = $('#matchBoard');
  if (!board) return;
  let touchStart = null;
  board.addEventListener('pointerdown', function(e){
    const cell = e.target.closest('.match-cell');
    if (!cell) return;
    e.preventDefault();
    try { getCtx(); } catch(err){}
    touchStart = {r:+cell.dataset.r, c:+cell.dataset.c, x:e.clientX, y:e.clientY, moved:false};
  }, {passive:false});
  board.addEventListener('pointermove', function(e){
    if (!touchStart) return;
    if (Math.hypot(e.clientX-touchStart.x, e.clientY-touchStart.y)>18) touchStart.moved = true;
  }, {passive:true});
  board.addEventListener('pointerup', function(e){
    if (!touchStart) return;
    const startInfo = touchStart;
    touchStart = null;
    const dx = e.clientX-startInfo.x, dy = e.clientY-startInfo.y;
    const dist = Math.hypot(dx,dy);
    if (dist<18 || !startInfo.moved){ onMatchTileTap(startInfo.r, startInfo.c); return; }
    let dr = 0, dc = 0;
    if (Math.abs(dx)>Math.abs(dy)) dc = dx>0?1:-1;
    else dr = dy>0?1:-1;
    const nr = startInfo.r+dr, nc = startInfo.c+dc;
    if (nr>=0 && nr<matchState.grid && nc>=0 && nc<matchState.grid){
      matchState.selected = null;
      updateMatchSelection();
      matchTrySwap(startInfo.r, startInfo.c, nr, nc);
    }
  });
  board.addEventListener('pointercancel', function(){ touchStart = null; });
}
function bindShootInput(){
  const c = $('#shootCanvas');
  if (!c) return;
  const getPos = function(clientX, clientY){
    const rect = c.getBoundingClientRect();
    if (rect.width<=0||rect.height<=0) return {x:0,y:0};
    return {x:(clientX-rect.left)/rect.width*SHOOT_SIZE, y:(clientY-rect.top)/rect.height*SHOOT_SIZE};
  };
  c.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try { getCtx(); } catch(err){}
    const p = getPos(e.clientX, e.clientY);
    shootAt(p.x, p.y);
  }, {passive:false});
  c.addEventListener('pointermove', function(e){
    if (e.pointerType==='touch') return;
    const p = getPos(e.clientX, e.clientY);
    shootState.aimX = p.x; shootState.aimY = p.y; shootState.showAim = true;
  });
  c.addEventListener('pointerleave', function(){ shootState.showAim = false; });
}
function bindPinballInput(){
  const c = $('#pinballCanvas');
  if (!c) return;
  const getPos = function(clientX, clientY){
    const rect = c.getBoundingClientRect();
    if (rect.width<=0||rect.height<=0) return {x:0,y:0};
    return {x:(clientX-rect.left)/rect.width*pinballState.W, y:(clientY-rect.top)/rect.height*pinballState.H};
  };
  c.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try { getCtx(); } catch(err){}
    const p = getPos(e.clientX, e.clientY);
    shootPinball(p.x, p.y);
  }, {passive:false});
  c.addEventListener('pointermove', function(e){
    if (e.pointerType==='touch') return;
    if (!pinballState.active) return;
    const p = getPos(e.clientX, e.clientY);
    pinballState.aimX = p.x; pinballState.aimY = p.y; pinballState.aimTimer = 0.1;
  });
}

$('#colorModeBtn').addEventListener('click', openColorLevels);
$('#mazeModeBtn').addEventListener('click', openMazeLevels);
$('#sokobanModeBtn').addEventListener('click', openSokobanLevels);
$('#matchModeBtn').addEventListener('click', openMatchLevels);
$('#slideModeBtn').addEventListener('click', openSlideLevels);
$('#shootModeBtn').addEventListener('click', openShootLevels);
$('#snakeModeBtn').addEventListener('click', openSnakeMenu);
$('#pinballModeBtn').addEventListener('click', startPinball);
$('#relaxModeBtn').addEventListener('click', function(){
  stopAllGames();
  showScreen('relax');
  buildBubbles();
  buildRelaxButtons();
});
$('#snakeEndlessBtn').addEventListener('click', function(){ startSnake('endless'); });
$('#snakeSurvivalBtn').addEventListener('click', function(){ startSnake('survival'); });
$('#snakeImmortalBtn').addEventListener('click', function(){ startSnake('immortal'); });
$('#snakeMenuBack').addEventListener('click', goHome);

$('#colorContinueBtn').addEventListener('click', function(){ startColorLevel(Math.min(state.color.unlocked, COLOR_TOTAL)); });
$('#mazeContinueBtn').addEventListener('click', function(){ startMazeLevel(Math.min(state.maze.unlocked, MAZE_TOTAL)); });
$('#sokobanContinueBtn').addEventListener('click', function(){ startSokobanLevel(Math.min(state.sokoban.unlocked, SOKOBAN_TOTAL)); });
$('#matchContinueBtn').addEventListener('click', function(){ startMatchLevel(Math.min(state.match.unlocked, MATCH_TOTAL)); });
$('#slideContinueBtn').addEventListener('click', function(){ startSlideLevel(Math.min(state.slide.unlocked, SLIDE_TOTAL)); });
$('#shootContinueBtn').addEventListener('click', function(){ startShootLevel(Math.min(state.shoot.unlocked, SHOOT_TOTAL)); });

$('#colorBack').addEventListener('click', goHome);
$('#mazeBack').addEventListener('click', goHome);
$('#sokobanBack').addEventListener('click', goHome);
$('#matchBack').addEventListener('click', goHome);
$('#slideBack').addEventListener('click', goHome);
$('#shootBack').addEventListener('click', goHome);
$('#snakeBack').addEventListener('click', goHome);
$('#pinballBack').addEventListener('click', goHome);
$('#relaxBack').addEventListener('click', goHome);
['#colorLevelsBack','#mazeLevelsBack','#sokobanLevelsBack','#matchLevelsBack','#slideLevelsBack','#shootLevelsBack'].forEach(function(sel){
  const el = $(sel);
  if (el) el.addEventListener('click', goHome);
});

function refreshSoundBtns(){
  const icon = state.sound?'🔊':'🔈';
  ['#colorSound','#mazeSound','#sokobanSound','#matchSound','#slideSound','#shootSound','#snakeSound','#pinballSound','#relaxSound'].forEach(function(sel){
    const el = $(sel); if (el) el.textContent = icon;
  });
}
['#colorSound','#mazeSound','#sokobanSound','#matchSound','#slideSound','#shootSound','#snakeSound','#pinballSound','#relaxSound'].forEach(function(sel){
  const el = $(sel);
  if (!el) return;
  el.addEventListener('click', function(){
    state.sound = !state.sound; save(); refreshSoundBtns();
    if (state.sound) beep(660,0.08);
  });
});

$('#resetAllBtn').addEventListener('click', function(){
  if (!confirm(t('resetConfirm'))) return;
  state.color = {unlocked:1,score:0,combo:0};
  state.maze = {unlocked:1,score:0};
  state.sokoban = {unlocked:1,score:0};
  state.match = {unlocked:1,score:0};
  state.slide = {unlocked:1,score:0};
  state.shoot = {unlocked:1,score:0};
  state.snake = {bestEndless:0,bestSurvival:0,bestImmortal:0};
  state.pinball = {best:0};
  save(); updateHome();
  beep(440,0.1,'sine',0.06);
  vibrate(25);
});

/* 键盘 */
document.addEventListener('keydown', function(e){
  if (e.key==='Enter'){
    const ov = $('#overlay');
    if (ov.classList.contains('show')){
      const btn = $('#ovBtn');
      if (btn && btn.style.display!=='none' && overlayPrimaryIsWin){ e.preventDefault(); btn.click(); return; }
    }
  }
  if (e.key==='Escape'){
    if ($('#overlay').classList.contains('show')){ closeOverlay(); return; }
  }
  if ($('#screen-maze').classList.contains('active') && mazeState.active){
    const k = e.key;
    if (k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); tryMove(0,-1); }
    else if (k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); tryMove(0,1); }
    else if (k==='ArrowLeft'||k==='a'||k==='A'){ e.preventDefault(); tryMove(-1,0); }
    else if (k==='ArrowRight'||k==='d'||k==='D'){ e.preventDefault(); tryMove(1,0); }
  }
  if ($('#screen-sokoban').classList.contains('active') && sokobanState.active){
    const k = e.key;
    if (k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); sokobanMove(0,-1); }
    else if (k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); sokobanMove(0,1); }
    else if (k==='ArrowLeft'||k==='a'||k==='A'){ e.preventDefault(); sokobanMove(-1,0); }
    else if (k==='ArrowRight'||k==='d'||k==='D'){ e.preventDefault(); sokobanMove(1,0); }
  }
  if ($('#screen-snake').classList.contains('active') && snakeState.running){
    const k = e.key;
    if (k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); setSnakeDir(0,-1); }
    else if (k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); setSnakeDir(0,1); }
    else if (k==='ArrowLeft'||k==='a'||k==='A'){ e.preventDefault(); setSnakeDir(-1,0); }
    else if (k==='ArrowRight'||k==='d'||k==='D'){ e.preventDefault(); setSnakeDir(1,0); }
  }
});

/* resize */
let resizeTimer = null;
window.addEventListener('resize', function(){
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    if (pinballState.canvas) resizePinballCanvas();
    if ($('#screen-match').classList.contains('active') && matchState.active){
      const boardEl = $('#matchBoard');
      const size = boardEl.clientWidth;
      if (size){
        const grid = matchState.grid;
        const gapSize = grid<=6?5:grid<=8?4:3;
        boardEl.style.setProperty('--tile-font', Math.round((size-12-(grid-1)*gapSize)/grid*0.58)+'px');
      }
    }
    if ($('#screen-slide').classList.contains('active') && slideState.active){
      const boardEl = $('#slideBoard');
      const w = boardEl.clientWidth;
      if (w) boardEl.style.setProperty('--tile-font', Math.round(w/slideState.size*0.38)+'px');
    }
  }, 180);
});

/* ========== 启动 ========== */
load();
refreshSoundBtns();
applyLang();
updateHome();
bindMazeInput();
bindSokobanInput();
bindSnakeInput();
bindPinballInput();
bindMatchInput();
bindShootInput();
startAd();
</script>
