<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>龙龙游戏厅 · LongLong Arcade</title>
<style>
/* ========== 基础 ========== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#0a0a12;color:#fff;overflow:hidden;user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 18% 12%,rgba(124,92,255,.14),transparent 42%),
    radial-gradient(circle at 84% 82%,rgba(0,224,198,.1),transparent 42%),
    radial-gradient(circle at 50% 50%,rgba(255,46,99,.05),transparent 60%)}

/* ========== 广告 ========== */
#adOverlay{position:fixed;inset:0;z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 24px;text-align:center;background:linear-gradient(160deg,#1a1030,#0a0a12 55%,#0e1a22);overflow:hidden}
#adOverlay.show{display:flex}
.ad-badge{position:absolute;top:calc(18px + env(safe-area-inset-top));left:18px;font-size:10px;font-weight:800;letter-spacing:1.5px;
  color:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.18);padding:4px 9px;border-radius:6px}
.ad-skip{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;padding:9px 16px;border-radius:99px;
  border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:rgba(255,255,255,.92);font-family:inherit;
  font-size:13px;font-weight:800;cursor:pointer;transition:transform .14s,background .14s;backdrop-filter:blur(6px)}
.ad-skip:active{transform:scale(.94);background:rgba(0,0,0,.6)}
.ad-glow{position:absolute;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,92,255,.35),transparent 70%);animation:adGlow 3.4s ease-in-out infinite;pointer-events:none}
@keyframes adGlow{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.22);opacity:1}}
.ad-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px}
.ad-emoji{font-size:76px;line-height:1;margin-bottom:6px;animation:adFloat 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(124,92,255,.55))}
@keyframes adFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.ad-title{font-size:30px;font-weight:900;letter-spacing:1px;background:linear-gradient(120deg,#fff 20%,#a99cff 55%,#5ef2d6 90%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ad-desc{font-size:14px;color:rgba(255,255,255,.5)}
.ad-dots{display:flex;gap:7px;margin-top:22px}
.ad-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2)}
.ad-dots span.on{background:#7c5cff;box-shadow:0 0 12px rgba(124,92,255,.9)}
.ad-count{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  font-size:11px;color:rgba(255,255,255,.35);letter-spacing:1px}

/* ========== 屏幕 ========== */
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom))}
.screen.active{display:flex}

/* ========== 首页 ========== */
#screen-home{align-items:center;justify-content:center;text-align:center;overflow-y:auto}
.home-inner{display:flex;flex-direction:column;align-items:center;width:100%;max-width:400px;padding:8px 0}
.logo-badge{width:52px;height:52px;display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px;animation:floaty 4s ease-in-out infinite}
.logo-badge span{border-radius:12px;background:#7c5cff;box-shadow:0 6px 24px rgba(124,92,255,.35)}
.logo-badge span:nth-child(3){background:#00e0c6;box-shadow:0 6px 24px rgba(0,224,198,.45)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
h1#homeTitle{font-size:24px;font-weight:900;letter-spacing:1px;line-height:1.15;margin-bottom:3px;
  background:linear-gradient(120deg,#fff 20%,#a99cff 55%,#5ef2d6 90%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#homeSub{font-size:10.5px;color:rgba(255,255,255,.45);margin-bottom:10px;line-height:1.5;padding:0 10px}

.mode-cards{display:flex;flex-direction:column;gap:5px;width:100%}
.mode-card{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);color:#fff;font-family:inherit;cursor:pointer;text-align:left;
  transition:transform .14s,background .14s;width:100%}
.mode-card:active{transform:scale(.97);background:rgba(255,255,255,.09)}
.mode-icon{font-size:19px;flex:0 0 auto}
.mode-text{flex:1;min-width:0}
.mode-name{font-size:12.5px;font-weight:800}
.mode-desc{font-size:9px;color:rgba(255,255,255,.42);margin-top:1px}
.mode-progress{font-size:9px;font-weight:800;color:#b9a9ff;background:rgba(124,92,255,.16);padding:4px 8px;border-radius:99px;flex:0 0 auto}

.btn{width:100%;padding:15px;border:none;border-radius:16px;font-size:15.5px;font-weight:800;
  font-family:inherit;cursor:pointer;transition:transform .14s ease;letter-spacing:.3px}
.btn:active{transform:scale(.965)}
.btn.primary{background:linear-gradient(135deg,#7c5cff,#00e0c6);color:#fff;box-shadow:0 10px 34px rgba(124,92,255,.42)}
.btn.ghost{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.11);margin-top:10px}

/* ========== 顶栏 ========== */
.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:42px;flex:0 0 auto}
.icon-btn{width:40px;height:40px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);
  color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:inherit;transition:transform .14s,background .14s;flex:0 0 auto}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.13)}
.level-chip{font-size:13px;font-weight:800;color:rgba(255,255,255,.92);letter-spacing:.4px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);padding:8px 16px;border-radius:99px;
  white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
.spacer{width:40px;flex:0 0 auto}

/* ========== 色觉 ========== */
.timer-wrap{height:8px;border-radius:99px;background:rgba(255,255,255,.08);margin:12px 0 4px;overflow:hidden;flex:0 0 auto}
.timer-bar{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#2ee6a8,#7c5cff);transition:background .3s}
.board-wrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px 0}
.board{display:grid;gap:var(--gap,8px);width:min(86vw,52vh,420px);height:min(86vw,52vh,420px)}
@supports (height:100dvh){.board{width:min(86vw,52dvh,420px);height:min(86vw,52dvh,420px)}}
.cell{border-radius:var(--radius,12px);cursor:pointer;animation:fadein .28s backwards}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.cell.wrong{animation:shake .3s;box-shadow:inset 0 0 0 3px #ff3b3b,0 0 24px rgba(255,59,59,.55)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.cell.correct{transform:scale(1.1);z-index:5;box-shadow:0 0 0 4px #fff,0 0 34px 10px rgba(255,255,255,.85);
  transition:transform .18s,box-shadow .18s}
.game-bottom{flex:0 0 auto;height:28px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.5px}
.combo-hot{color:#ffd166;text-shadow:0 0 20px rgba(255,209,102,.6)}

/* ========== 迷宫 ========== */
.maze-wrap,.sokoban-wrap,.snake-wrap,.match-wrap,.slide-wrap,.shoot-wrap,.pinball-wrap{
  flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px 0}
.maze-board{display:grid;gap:0;width:min(90vw,58vh,440px);height:min(90vw,58vh,440px);
  background:rgba(255,255,255,.02);border-radius:16px;padding:5px;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.45);touch-action:none}
@supports (height:100dvh){.maze-board{width:min(90vw,58dvh,440px);height:min(90vw,58dvh,440px)}}
.maze-cell{border:2px solid transparent;box-sizing:border-box;position:relative}
.maze-cell.player::after{content:"";position:absolute;inset:20%;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,#8b6dff);
  box-shadow:0 0 12px rgba(124,92,255,.9),0 0 22px rgba(124,92,255,.4)}
.maze-cell.goal::after{content:"";position:absolute;inset:26%;border-radius:26%;
  background:radial-gradient(circle at 34% 30%,#fff,#00e0c6);
  box-shadow:0 0 14px rgba(0,224,198,.9),0 0 26px rgba(0,224,198,.4);
  animation:goalPulse 1.5s ease-in-out infinite}
@keyframes goalPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.14);opacity:1}}
.maze-bump{animation:bump .22s}
@keyframes bump{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--bump-x,0))}}

/* ========== 推方块 ========== */
.sokoban-board{display:grid;gap:3px;width:min(88vw,48vh,420px);height:min(88vw,48vh,420px);touch-action:none}
@supports (height:100dvh){.sokoban-board{width:min(88vw,48dvh,420px);height:min(88vw,48dvh,420px)}}
.sokoban-cell{border-radius:7px;position:relative;background:rgba(255,255,255,.035)}
.sokoban-cell.wall{background:linear-gradient(160deg,rgba(124,92,255,.28),rgba(124,92,255,.16));
  box-shadow:inset 0 0 0 1px rgba(124,92,255,.28)}
.sokoban-cell.goal::before{content:"";position:absolute;inset:33%;border-radius:50%;
  background:rgba(0,224,198,.32);box-shadow:0 0 9px rgba(0,224,198,.4)}
.sokoban-cell.box::after{content:"";position:absolute;inset:14%;border-radius:5px;
  background:linear-gradient(160deg,#ffd166,#ff9f43);
  box-shadow:0 2px 10px rgba(255,159,67,.5),inset 0 -3px 0 rgba(0,0,0,.16)}
.sokoban-cell.box.on-goal::after{background:linear-gradient(160deg,#5ef2d6,#00b89c);
  box-shadow:0 2px 14px rgba(0,224,198,.7),inset 0 -3px 0 rgba(0,0,0,.16)}
.sokoban-cell.player::after{content:"";position:absolute;inset:20%;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,#8b6dff);
  box-shadow:0 0 13px rgba(124,92,255,.9),0 0 24px rgba(124,92,255,.4)}
.sokoban-controls{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 4px 0}
.dpad{display:grid;grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,36px);gap:5px}
.dpad-btn,.snake-dpad-btn{border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(255,255,255,.075);
  color:rgba(255,255,255,.8);font-size:13px;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .1s,background .1s;touch-action:none}
.dpad-btn:active,.snake-dpad-btn:active{background:rgba(255,255,255,.2);transform:scale(.92)}
.dpad-btn[data-dir="up"]{grid-area:1/2/2/3}
.dpad-btn[data-dir="left"]{grid-area:2/1/3/2}
.dpad-btn[data-dir="right"]{grid-area:2/3/3/4}
.dpad-btn[data-dir="down"]{grid-area:3/2/4/3}
.sokoban-stat,.snake-stat{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.45);text-align:right;line-height:1.6}
.sokoban-stat b,.snake-stat b{color:#b9a9ff;font-weight:800}

/* ========== 贪吃蛇 ========== */
.snake-board{display:grid;gap:1px;width:min(90vw,50vh,460px);height:min(90vw,50vh,460px);
  background:rgba(255,255,255,.03);border-radius:14px;padding:4px;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 10px 40px rgba(0,0,0,.4);touch-action:none}
@supports (height:100dvh){.snake-board{width:min(90vw,50dvh,460px);height:min(90vw,50dvh,460px)}}
.snake-board.immortal{box-shadow:0 0 0 1px rgba(0,224,198,.42),0 0 30px rgba(0,224,198,.16),0 10px 40px rgba(0,0,0,.4)}
.snake-cell{background:rgba(255,255,255,.028);border-radius:2px}
.snake-cell.head{background:radial-gradient(circle at 34% 30%,#fff,#8b6dff);
  box-shadow:0 0 8px rgba(124,92,255,.75);border-radius:4px}
.snake-board.immortal .snake-cell.head{background:radial-gradient(circle at 34% 30%,#fff,#00e0c6);
  box-shadow:0 0 10px rgba(0,224,198,.85)}
.snake-cell.body{background:linear-gradient(160deg,#7c5cff,#5a3fcc);border-radius:3px}
.snake-board.immortal .snake-cell.body{background:linear-gradient(160deg,#00e0c6,#009e8c)}
.snake-cell.food{background:radial-gradient(circle at 34% 30%,#fff,#ff5c8a);
  box-shadow:0 0 10px rgba(255,92,138,.8);border-radius:50%;animation:foodPulse 1s ease-in-out infinite}
@keyframes foodPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.snake-cell.obstacle{background:linear-gradient(160deg,#ff9f43,#e67e22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);border-radius:4px}
.snake-controls{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 4px 0}
.snake-dpad{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:4px}
.snake-dpad-btn{font-size:12px;border-radius:10px}
.snake-dpad-btn[data-dir="up"]{grid-area:1/2/2/3}
.snake-dpad-btn[data-dir="left"]{grid-area:2/1/3/2}
.snake-dpad-btn[data-dir="right"]{grid-area:2/3/3/4}
.snake-dpad-btn[data-dir="down"]{grid-area:3/2/4/3}

/* ========== 消消乐 ========== */
.match-hud,.slide-hud,.shoot-hud{display:flex;gap:8px;margin:10px 0 7px;flex:0 0 auto}
.match-stat,.slide-stat,.shoot-stat{flex:1;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:7px 8px;text-align:center}
.match-stat-label,.slide-stat-label,.shoot-stat-label{display:block;font-size:9.5px;color:rgba(255,255,255,.42);
  font-weight:700;letter-spacing:.5px;margin-bottom:1px}
.match-stat-value,.slide-stat-value,.shoot-stat-value{display:block;font-size:16px;font-weight:900;color:#fff;
  font-variant-numeric:tabular-nums;transition:color .25s}
.match-stat-value.warn,.shoot-stat-value.warn{color:#ff9f43}
.match-stat-value.danger,.shoot-stat-value.danger{color:#ff5c8a;animation:matchUrgent .6s ease-in-out infinite}
@keyframes matchUrgent{0%,100%{opacity:1}50%{opacity:.5}}
.match-progress{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;flex:0 0 auto}
.match-progress-bar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#2ee6a8,#7c5cff);
  transition:width .35s ease,background .35s}
.match-board{display:grid;width:min(92vw,56vh,450px);height:min(92vw,56vh,450px);padding:6px;border-radius:18px;
  background:rgba(255,255,255,.032);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.45);touch-action:none}
@supports (height:100dvh){.match-board{width:min(92vw,56dvh,450px);height:min(92vw,56dvh,450px)}}
.match-cell{border-radius:9px;position:relative;background:rgba(255,255,255,.022)}
.match-tile{position:absolute;inset:0;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:var(--tile-font,20px);line-height:1;transition:transform .12s ease,box-shadow .12s ease;
  user-select:none;-webkit-user-select:none;text-shadow:0 2px 4px rgba(0,0,0,.28)}
.match-tile.selected{transform:scale(1.14);z-index:5;box-shadow:0 0 0 3px #fff,0 0 24px rgba(255,255,255,.85)}
.match-tile.clearing{animation:matchClear .26s forwards;pointer-events:none}
@keyframes matchClear{0%{transform:scale(1);opacity:1}42%{transform:scale(1.34);opacity:.88}100%{transform:scale(0);opacity:0}}
.match-tile.dropping{animation:matchDrop .24s cubic-bezier(.35,1.5,.6,1)}
@keyframes matchDrop{from{transform:translateY(-42%);opacity:0}to{transform:translateY(0);opacity:1}}

/* ========== 华容道 ========== */
.slide-board{position:relative;width:min(90vw,56vh,450px);height:min(90vw,56vh,450px);
  background:rgba(255,255,255,.03);border-radius:16px;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.45);touch-action:none;
  --n:3;--gap:4px;--tile-font:24px}
@supports (height:100dvh){.slide-board{width:min(90vw,56dvh,450px);height:min(90vw,56dvh,450px)}}
.slide-tile{position:absolute;left:0;top:0;width:calc(100%/var(--n));height:calc(100%/var(--n));
  box-sizing:border-box;padding:var(--gap);transition:transform .15s cubic-bezier(.3,1.3,.5,1);cursor:pointer;will-change:transform}
.slide-face{width:100%;height:100%;border-radius:10px;background:linear-gradient(160deg,#7c5cff,#5a3fcc);
  box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 -3px 0 rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:var(--tile-font);color:#fff;
  text-shadow:0 2px 4px rgba(0,0,0,.35);transition:filter .15s,background .15s,box-shadow .15s}
.slide-tile.movable .slide-face{background:linear-gradient(160deg,#9d7dff,#7c5cff);box-shadow:0 4px 14px rgba(124,92,255,.5),inset 0 -3px 0 rgba(0,0,0,.2)}
.slide-tile.bump .slide-face{animation:slideBump .24s}
@keyframes slideBump{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.9) saturate(1.7) hue-rotate(20deg)}}

/* ========== 射击 ========== */
#shootCanvas{display:block;border-radius:18px;background:#0a0a16;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.5);
  width:min(90vw,56vh,450px);height:min(90vw,56vh,450px);touch-action:none;cursor:crosshair}
@supports (height:100dvh){#shootCanvas{width:min(90vw,56dvh,450px);height:min(90vw,56dvh,450px)}}

/* ========== 弹珠 ========== */
#pinballCanvas{display:block;border-radius:18px;background:#0a0a16;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.5);
  width:min(90vw,58vh,460px);height:min(90vw,58vh,460px);touch-action:none;cursor:crosshair}
@supports (height:100dvh){#pinballCanvas{width:min(90vw,58dvh,460px);height:min(90vw,58dvh,460px)}}
.pinball-info{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0;font-size:13px;font-weight:700}
.pinball-time{color:#5ef2d6;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.5px;transition:color .3s}
.pinball-time.urgent{color:#ff5c8a;animation:pinballUrgent .5s ease-in-out infinite}
@keyframes pinballUrgent{0%,100%{opacity:1}50%{opacity:.55}}
.pinball-best{color:rgba(255,255,255,.5);font-size:12.5px}

/* ========== 解压 ========== */
.relax-tabs{display:flex;gap:6px;flex:0 0 auto;margin:10px 0 6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.relax-tabs::-webkit-scrollbar{display:none}
.relax-tab{flex:1 0 auto;padding:9px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);font-family:inherit;font-size:12.5px;font-weight:800;
  cursor:pointer;transition:all .15s;white-space:nowrap}
.relax-tab.active{background:linear-gradient(135deg,rgba(124,92,255,.6),rgba(0,224,198,.45));color:#fff;
  border-color:rgba(124,92,255,.6);box-shadow:0 4px 16px rgba(124,92,255,.3)}
.relax-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.relax-body::-webkit-scrollbar{width:4px}
.relax-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.relax-panel{padding:8px 2px 40px}
.bubble-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:10px}
.bubble{aspect-ratio:1/1;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 32% 28%,hsla(var(--h),92%,90%,.97),hsla(var(--h),78%,68%,.75) 55%,hsla(var(--h),70%,54%,.6));
  box-shadow:inset 0 -4px 9px hsla(var(--h),60%,38%,.28),inset 0 3px 7px rgba(255,255,255,.55),0 2px 9px rgba(0,0,0,.2);
  transition:transform .09s;will-change:transform}
.bubble:active{transform:scale(.88)}
.bubble.popped{animation:bubblePop .38s forwards;pointer-events:none}
@keyframes bubblePop{0%{transform:scale(1);opacity:1}45%{transform:scale(1.32);opacity:.85}100%{transform:scale(0);opacity:0}}
.bubble-hint{text-align:center;font-size:12px;color:rgba(255,255,255,.35);margin-bottom:14px;letter-spacing:.4px}
.sound-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.sound-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:7px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.055);color:#fff;font-family:inherit;font-size:9.5px;font-weight:700;
  cursor:pointer;transition:transform .12s,background .12s,box-shadow .2s;min-height:54px;text-align:center;line-height:1.2;overflow:hidden}
.sound-btn:active{transform:scale(.93);background:rgba(255,255,255,.12)}
.sound-btn .emoji{font-size:18px;line-height:1}
.sound-btn.playing{background:linear-gradient(135deg,rgba(124,92,255,.5),rgba(0,224,198,.35));
  border-color:rgba(124,92,255,.55);box-shadow:0 0 18px rgba(124,92,255,.42);transform:scale(1.06)}
.voice-btn .native{font-size:13px;font-weight:900;color:#fff;letter-spacing:.5px}
.voice-btn .lang-label{font-size:9px;color:rgba(255,255,255,.5);font-weight:600}
.load-more{width:100%;padding:11px;margin-top:12px;border-radius:12px;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);
  font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.load-more:active{background:rgba(255,255,255,.12)}

/* ========== 关卡选择 ========== */
.levels-grid{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:9px;
  padding:14px 2px 40px;-webkit-overflow-scrolling:touch}
.levels-grid::-webkit-scrollbar{width:4px}
.levels-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.lvl-btn{aspect-ratio:1/1;border:1px solid rgba(255,255,255,.08);border-radius:14px;
  background:rgba(255,255,255,.06);color:#fff;font-weight:800;font-size:14.5px;
  font-family:inherit;cursor:pointer;transition:transform .12s,background .12s}
.lvl-btn:active{transform:scale(.93)}
.lvl-btn.done{background:linear-gradient(135deg,rgba(124,92,255,.55),rgba(0,224,198,.42));
  border-color:rgba(124,92,255,.55);box-shadow:0 4px 18px rgba(124,92,255,.22)}
.lvl-btn.locked{opacity:.26;cursor:not-allowed;font-size:12px}

/* ========== 弹窗 ========== */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(6,6,14,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity .25s ease}
.overlay.show{opacity:1;pointer-events:auto}
.overlay-card{width:100%;max-width:340px;border-radius:28px;padding:28px 22px 22px;
  background:linear-gradient(160deg,#1b1b30,#11111d);border:1px solid rgba(255,255,255,.1);
  box-shadow:0 30px 70px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px;text-align:center;
  transform:translateY(20px) scale(.94);transition:transform .34s cubic-bezier(.2,1.5,.45,1)}
.overlay.show .overlay-card{transform:translateY(0) scale(1)}
.overlay-icon{font-size:42px;line-height:1;margin-bottom:2px}
.overlay-card h2{font-size:22px;font-weight:900;letter-spacing:.4px}
.overlay-card p{font-size:14.5px;color:rgba(255,255,255,.55);margin-bottom:2px}
.stars{display:flex;justify-content:center;gap:8px;font-size:29px;height:34px;align-items:center;margin:2px 0 8px}
.star{color:rgba(255,255,255,.13)}
.star.on{color:#ffd166;text-shadow:0 0 20px rgba(255,209,102,.85);animation:starPop .45s backwards}
@keyframes starPop{from{transform:scale(0) rotate(-60deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.hint-enter{font-size:11.5px;color:rgba(255,255,255,.32);margin-top:2px;letter-spacing:.4px}

/* ========== 语言按钮 ========== */
.lang-float{position:fixed;top:calc(15px + env(safe-area-inset-top));right:15px;z-index:20;

  cursor:pointer;font-family:inherit;transition:transform .14s,background .14s}
.lang-float:active{transform:scale(.93)}
</style>
</head>

  let s = (T[state.lang] && T[state.lang][key]) || T.zh[key] || key;

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (LANGS.indexOf(d.lang)>=0) state.lang = d.lang;
    if (typeof d.sound==='boolean') state.sound = d.sound;
    ['color','maze','sokoban','match','slide','shoot'].forEach(function(key){
      if (d[key] && typeof d[key].unlocked==='number'){
        const total = key==='color'?COLOR_TOTAL:key==='maze'?MAZE_TOTAL:key==='sokoban'?SOKOBAN_TOTAL:key==='match'?MATCH_TOTAL:key==='slide'?SLIDE_TOTAL:SHOOT_TOTAL;
        state[key].unlocked = clamp(d[key].unlocked|0||1, 1, total);
        state[key].score = d[key].score|0||0;
      }
    });
    if (d.snake){
      state.snake.bestEndless = d.snake.bestEndless|0||0;
      state.snake.bestSurvival = d.snake.bestSurvival|0||0;
      state.snake.bestImmortal = d.snake.bestImmortal|0||0;
    }
    if (d.pinball) state.pinball.best = d.pinball.best|0||0;
  }catch(e){}
}

/* ========== 音频 ========== */
let audioCtx = null;
function getCtx(){
  if (!audioCtx){
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e){ return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
  return audioCtx;
}
function beep(freq, dur, type, vol){
  if (!state.sound) return;
  dur = dur||0.09; type = type||'sine'; vol = vol||0.07;
  try{
    const ctx = getCtx();
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    const now = ctx.currentTime;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now+dur+0.02);
  }catch(e){}
}
function noiseBurst(dur, vol, hp, lp){
  if (!state.sound) return;
  try{
    const ctx = getCtx();
    if (!ctx) return;
    const len = Math.max(1, Math.floor(ctx.sampleRate*dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.value = vol;
    let node = src;
    if (hp){ const f = ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; node.connect(f); node=f; }
    if (lp){ const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; node.connect(f); node=f; }
    node.connect(g); g.connect(ctx.destination);
    src.start();
  }catch(e){}
}
function vibrate(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

const colorState = { current:1, timerId:null, timeLeft:0, timeLimit:1, active:false, locked:false };
let colorActive = false;
function getGridSize(lv){ return lv<=4?2:lv<=14?3:lv<=30?4:lv<=52?5:lv<=80?6:lv<=112?7:lv<=150?8:9; }
function getDelta(lv){ return Math.max(9, 61.5-lv*0.307); }
function getTimeLimit(lv, size){ return Math.max(3.8, (3+size*1.15)*(1-lv*0.0018)); }
function updateColorTimer(){
  const p = clamp(colorState.timeLeft/colorState.timeLimit, 0, 1);
  const bar = $('#colorTimerBar');
  bar.style.width = (p*100)+'%';
  bar.style.background = p>0.5?'linear-gradient(90deg,#2ee6a8,#7c5cff)':
    p>0.25?'linear-gradient(90deg,#ffd166,#ff9f43)':'linear-gradient(90deg,#ff5c5c,#ff2e63)';
}
function startColorLevel(level){
  stopAllGames();
  colorState.current = level; colorActive = true;
  showScreen('color');
  $('#colorLevelChip').textContent = t('levelN',{n:level});
  const size = getGridSize(level), delta = getDelta(level), count = size*size;
  const oddIndex = randInt(0, count-1);
  const hue = Math.random()*360, sat = 60+Math.random()*25, lig = 48+Math.random()*15;
  const hueShift = Math.min(180, delta*0.55)*(Math.random()<0.5?-1:1);
  const ligShift = delta*0.14*(Math.random()<0.5?-1:1);
  const baseCss = `hsl(${hue.toFixed(1)},${sat.toFixed(0)}%,${lig.toFixed(0)}%)`;

const mazeState = { cols:0,rows:0,cells:null,player:{x:0,y:0},goal:{x:0,y:0},steps:0,cellEls:[],level:1,active:false,solved:false,optimal:0 };
function getMazeSize(lv){ return lv<=15?5:lv<=35?6:lv<=55?7:lv<=75?8:lv<=95?9:lv<=110?10:11; }
function genMaze(w,h){
  const cells = [];
  for (let i=0;i<w*h;i++) cells.push({walls:[true,true,true,true]});
  const idx = (x,y)=>y*w+x;
  const visited = new Array(w*h).fill(false);
  const stack = [{x:0,y:0}]; visited[0] = true;
  const OPP = [2,3,0,1];
  while (stack.length){
    const cur = stack[stack.length-1];
    const x = cur.x, y = cur.y;
    const nb = [];
    if (y>0 && !visited[idx(x,y-1)]) nb.push({x,y:y-1,dir:0});
    if (x<w-1 && !visited[idx(x+1,y)]) nb.push({x:x+1,y,dir:1});
    if (y<h-1 && !visited[idx(x,y+1)]) nb.push({x,y:y+1,dir:2});
    if (x>0 && !visited[idx(x-1,y)]) nb.push({x:x-1,y,dir:3});
    if (!nb.length){ stack.pop(); continue; }
    const p = nb[Math.floor(Math.random()*nb.length)];
    cells[idx(x,y)].walls[p.dir] = false;
    cells[idx(p.x,p.y)].walls[OPP[p.dir]] = false;
    visited[idx(p.x,p.y)] = true;
    stack.push({x:p.x,y:p.y});
  }
  return cells;
}
function mazeOptimal(cells,w,h,sx,sy,gx,gy){
  const dist = new Array(w*h).fill(-1);
  const start = sy*w+sx; dist[start] = 0;
  const q = [start]; let head = 0;
  const DIRS = [[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]];
  while (head<q.length){
    const cur = q[head++];
    const cx = cur%w, cy = (cur-cx)/w;
    if (cx===gx && cy===gy) return dist[cur];
    const cell = cells[cur];
    for (let d=0;d<4;d++){
      if (cell.walls[d]) continue;
      const nx = cx+DIRS[d][0], ny = cy+DIRS[d][1];
      if (nx<0||nx>=w||ny<0||ny>=h) continue;
      const ni = ny*w+nx;
      if (dist[ni]!==-1) continue;
      dist[ni] = dist[cur]+1; q.push(ni);
    }
  }
  return -1;
}
function startMazeLevel(level){
  stopAllGames();
  const size = getMazeSize(level);
  const w = size, h = size;
  const cells = genMaze(w,h);
  mazeState.cols = w; mazeState.rows = h; mazeState.cells = cells;
  mazeState.player = {x:0,y:0}; mazeState.goal = {x:w-1,y:h-1};
  mazeState.steps = 0; mazeState.solved = false; mazeState.level = level;
  mazeState.active = true;
  mazeState.optimal = mazeOptimal(cells,w,h,0,0,w-1,h-1);
  showScreen('maze');
  $('#mazeLevelChip').textContent = t('levelN',{n:level});
  const board = $('#mazeBoard');
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${w},1fr)`;
  board.style.gridTemplateRows = `repeat(${h},1fr)`;
  const WALL = 'rgba(165,165,215,.5)';
  const els = [];
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const cell = cells[y*w+x];
    const el = document.createElement('div');
    el.className = 'maze-cell';
    if (cell.walls[0]) el.style.borderTopColor = WALL;
    if (cell.walls[1]) el.style.borderRightColor = WALL;
    if (cell.walls[2]) el.style.borderBottomColor = WALL;
    if (cell.walls[3]) el.style.borderLeftColor = WALL;
    els.push(el); board.appendChild(el);
  }
  mazeState.cellEls = els;
  els[mazeState.goal.y*w+mazeState.goal.x].classList.add('goal');
  updateMazePlayer(); updateMazeSteps();
}
function updateMazePlayer(){
  const els = mazeState.cellEls;
  for (let i=0;i<els.length;i++) els[i].classList.remove('player');
  const p = mazeState.player;
  const el = els[p.y*mazeState.cols+p.x];
  if (el) el.classList.add('player');
}
function updateMazeSteps(){ $('#mazeSteps').textContent = t('steps',{n:mazeState.steps}); }
function tryMove(dx,dy){
  if (!mazeState.active||mazeState.solved) return false;
  const p = mazeState.player;
  const nx = p.x+dx, ny = p.y+dy;
  if (nx<0||nx>=mazeState.cols||ny<0||ny>=mazeState.rows) return false;
  const cell = mazeState.cells[p.y*mazeState.cols+p.x];
  let blocked = false;
  if (dx===1&&cell.walls[1]) blocked = true;
  if (dx===-1&&cell.walls[3]) blocked = true;
  if (dy===1&&cell.walls[2]) blocked = true;
  if (dy===-1&&cell.walls[0]) blocked = true;
  if (blocked){
    const el = mazeState.cellEls[p.y*mazeState.cols+p.x];
    el.style.setProperty('--bump-x',(dx*3)+'px');
    el.classList.remove('maze-bump'); void el.offsetWidth; el.classList.add('maze-bump');
    setTimeout(function(){ el.classList.remove('maze-bump'); }, 240);
    beep(120,0.06,'square',0.035);
    return false;
  }
  p.x = nx; p.y = ny;
  mazeState.steps++;
  updateMazePlayer(); updateMazeSteps();
  if (nx===mazeState.goal.x&&ny===mazeState.goal.y) winMaze();
  return true;
}
function winMaze(){
  mazeState.active = false; mazeState.solved = true;
  const ratio = mazeState.steps/Math.max(1,mazeState.optimal);
  const stars = ratio<=1.4?3:ratio<=2.0?2:1;
  const gained = 80+stars*30;
  state.maze.score += gained;
  state.maze.unlocked = Math.max(state.maze.unlocked, Math.min(MAZE_TOTAL, mazeState.level+1));
  save(); updateHome();
  beep(880,0.09,'sine',0.08);
  setTimeout(function(){ beep(1568,0.16,'sine',0.07); }, 185);
  vibrate(20);
  const isFinal = mazeState.level>=MAZE_TOTAL;
  openOverlay({icon:isFinal?'🏆':'✨',title:isFinal?t('allClear'):t('mazeClear'),sub:'+'+gained,stars,enterToNext:!isFinal,
    primary:isFinal?{label:t('levelsTitle'),fn:function(){closeOverlay();openMazeLevels();}}
      :{label:t('next'),fn:function(){closeOverlay();startMazeLevel(mazeState.level+1);}},
    secondary:{label:t('retry'),fn:function(){closeOverlay();startMazeLevel(mazeState.level);}}});
}

/* ========== 推方块 ========== */
const DIRS4 = [[0,-1],[1,0],[0,1],[-1,0]];
const sokobanState = { level:1,W:0,H:0,isWall:[],goals:[],boxes:[],player:0,steps:0,active:false,solved:false,cellEls:[] };
function getSokobanConfig(lv){
  if (lv<=20) return {size:6,boxes:1};
  if (lv<=45) return {size:6,boxes:2};
  if (lv<=75) return {size:7,boxes:2};
  if (lv<=105) return {size:7,boxes:3};
  if (lv<=130) return {size:8,boxes:3};
  return {size:8,boxes:4};
}
function bfsReach(start,W,H,isWall,boxSet){
  const N = W*H;
  const reach = new Uint8Array(N);
  const q = [start]; reach[start] = 1;
  let head = 0;
  while (head<q.length){
    const cur = q[head++];
    const cx = cur%W, cy = Math.floor(cur/W);
    for (let k=0;k<4;k++){
      const nx = cx+DIRS4[k][0], ny = cy+DIRS4[k][1];
      if (nx<0||nx>=W||ny<0||ny>=H) continue;
      const ni = ny*W+nx;
      if (reach[ni]||isWall[ni]||boxSet.has(ni)) continue;
      reach[ni] = 1; q.push(ni);
    }
  }
  return reach;
}
function tryGenerateSokoban(W,H,numBoxes){
  const N = W*H;
  const idx = (x,y)=>y*W+x;
  const isWall = new Uint8Array(N);
  for (let x=0;x<W;x++){ isWall[x]=1; isWall[(H-1)*W+x]=1; }
  for (let y=0;y<H;y++){ isWall[y*W]=1; isWall[y*W+W-1]=1; }
  const interior = (W-2)*(H-2);
  const wallCount = Math.floor(interior*(0.04+Math.random()*0.07));
  let placed = 0, safety = 0;
  while (placed<wallCount && safety<200){
    safety++;
    const x = 1+Math.floor(Math.random()*(W-2));
    const y = 1+Math.floor(Math.random()*(H-2));
    if (!isWall[idx(x,y)]){ isWall[idx(x,y)] = 1; placed++; }
  }
  const free = [];
  for (let y=1;y<H-1;y++) for (let x=1;x<W-1;x++) if (!isWall[idx(x,y)]) free.push(idx(x,y));
  if (free.length<numBoxes*4+4) return null;
  const shuffled = free.slice();
  for (let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }
  const goalIdxs = shuffled.slice(0,numBoxes);
  const goalSet = new Set(goalIdxs);
  const boxes = goalIdxs.slice();
  const boxSet = new Set(boxes);
  let player = -1;
  for (let i=numBoxes;i<shuffled.length;i++) if (!boxSet.has(shuffled[i])){ player = shuffled[i]; break; }
  if (player<0) return null;
  const maxPulls = numBoxes*40+80;
  let pullsDone = 0, safety2 = 0;
  while (pullsDone<maxPulls && safety2<5000){
    safety2++;
    const hasBoxOnGoal = boxes.some(b=>goalSet.has(b));
    if (!hasBoxOnGoal && pullsDone>=numBoxes*2) break;
    const reach = bfsReach(player,W,H,isWall,boxSet);
    const allPulls = [];
    for (let bi=0;bi<boxes.length;bi++){
      const b = boxes[bi];
      const bx = b%W, by = Math.floor(b/W);
      for (let k=0;k<4;k++){
        const px = bx+DIRS4[k][0], py = by+DIRS4[k][1];
        const qx = bx+2*DIRS4[k][0], qy = by+2*DIRS4[k][1];
        if (px<0||px>=W||py<0||py>=H) continue;
        if (qx<0||qx>=W||qy<0||qy>=H) continue;
        const pIdx = py*W+px, qIdx = qy*W+qx;
        if (isWall[pIdx]||isWall[qIdx]) continue;
        if (boxSet.has(pIdx)||boxSet.has(qIdx)) continue;
        if (!reach[pIdx]) continue;
        allPulls.push({bi,pIdx,qIdx,fromGoal:goalSet.has(b),toGoal:goalSet.has(pIdx)});
      }
    }
    if (!allPulls.length) break;
    let pool;
    if (hasBoxOnGoal){
      pool = allPulls.filter(p=>p.fromGoal && !p.toGoal);
      if (!pool.length) pool = allPulls.filter(p=>p.fromGoal);
      if (!pool.length) pool = allPulls.filter(p=>!p.toGoal);
      if (!pool.length) pool = allPulls;
    } else {
      pool = allPulls.filter(p=>!p.toGoal);
      if (!pool.length) pool = allPulls;
    }
    const pick = pool[Math.floor(Math.random()*pool.length)];
    boxSet.delete(boxes[pick.bi]);
    boxes[pick.bi] = pick.pIdx;
    boxSet.add(pick.pIdx);
    player = pick.qIdx; pullsDone++;
  }
  for (const b of boxes) if (goalSet.has(b)) return null;
  if (new Set(boxes).size!==boxes.length) return null;
  if (boxSet.has(player)) return null;
  return {W,H,isWall:Array.from(isWall),goals:goalIdxs.slice(),boxes:boxes.slice(),player};
}
function fallbackSokoban(W,H){
  const idx = (x,y)=>y*W+x;
  const isWall = new Array(W*H).fill(0);
  for (let x=0;x<W;x++){ isWall[x]=1; isWall[(H-1)*W+x]=1; }
  for (let y=0;y<H;y++){ isWall[y*W]=1; isWall[y*W+W-1]=1; }
  const gx = Math.min(2,W-3), gy = Math.min(2,H-4);
  return {W,H,isWall,goals:[idx(gx,gy)],boxes:[idx(gx+1,gy)],player:idx(gx+2,gy)};
}
function generateSokoban(level){
  const cfg = getSokobanConfig(level);
  for (let i=0;i<80;i++){
    const r = tryGenerateSokoban(cfg.size,cfg.size,cfg.boxes);
    if (r) return r;
  }
  return fallbackSokoban(cfg.size,cfg.size);
}
function renderSokoban(){
  const W = sokobanState.W, H = sokobanState.H;
  const isWall = sokobanState.isWall;
  const goalSet = new Set(sokobanState.goals);
  const boxSet = new Set(sokobanState.boxes);
  const player = sokobanState.player;
  if (!sokobanState.cellEls.length || sokobanState.cellEls.length!==W*H){
    const board = $('#sokobanBoard');
    board.innerHTML = '';
    board.style.gridTemplateColumns = `repeat(${W},1fr)`;
    board.style.gridTemplateRows = `repeat(${H},1fr)`;
    const els = [];
    for (let i=0;i<W*H;i++){ const el = document.createElement('div'); board.appendChild(el); els.push(el); }
    sokobanState.cellEls = els;
  }
  const els = sokobanState.cellEls;
  for (let i=0;i<els.length;i++){
    let cls = 'sokoban-cell';
    if (isWall[i]) cls += ' wall';
    else {
      if (goalSet.has(i)) cls += ' goal';
      if (boxSet.has(i)) cls += ' box'+(goalSet.has(i)?' on-goal':'');
      if (i===player) cls += ' player';
    }
    if (els[i].className!==cls) els[i].className = cls;
  }
}
function updateSokobanStat(){
  const goalSet = new Set(sokobanState.goals);
  let done = 0;
  for (const b of sokobanState.boxes) if (goalSet.has(b)) done++;
  $('#sokobanStat').innerHTML = t('steps',{n:sokobanState.steps})+'<br><b>'+t('boxesDone',{a:done,b:sokobanState.boxes.length})+'</b>';
}
function sokobanMove(dx,dy){
  if (!sokobanState.active||sokobanState.solved) return;
  const W = sokobanState.W, H = sokobanState.H;
  const isWall = sokobanState.isWall, boxes = sokobanState.boxes;
  const p = sokobanState.player;
  const px = p%W, py = Math.floor(p/W);
  const nx = px+dx, ny = py+dy;
  if (nx<0||nx>=W||ny<0||ny>=H) return;
  const ni = ny*W+nx;
  if (isWall[ni]) return;
  const boxIdx = boxes.indexOf(ni);
  if (boxIdx>=0){
    const bx = nx+dx, by = ny+dy;
    if (bx<0||bx>=W||by<0||by>=H) return;
    const bi = by*W+bx;
    if (isWall[bi]) return;
    if (boxes.indexOf(bi)>=0) return;
    boxes[boxIdx] = bi;
    sokobanState.player = ni;
    sokobanState.steps++;
    beep(420,0.05,'sine',0.04);
  } else {
    sokobanState.player = ni;
    sokobanState.steps++;
  }
  renderSokoban(); updateSokobanStat(); checkSokobanWin();
}
function checkSokobanWin(){
  const goalSet = new Set(sokobanState.goals);
  for (const b of sokobanState.boxes) if (!goalSet.has(b)) return;
  sokobanState.active = false; sokobanState.solved = true;
  const optimalGuess = sokobanState.boxes.length*12+20;
  const ratio = sokobanState.steps/optimalGuess;
  const stars = ratio<=1.5?3:ratio<=2.5?2:1;
  const gained = 60+stars*35;
  state.sokoban.score += gained;
  state.sokoban.unlocked = Math.max(state.sokoban.unlocked, Math.min(SOKOBAN_TOTAL, sokobanState.level+1));
  save(); updateHome();
  beep(784,0.09,'sine',0.08);
  setTimeout(function(){ beep(1318,0.17,'sine',0.07); }, 195);
  vibrate(20);
  const isFinal = sokobanState.level>=SOKOBAN_TOTAL;
  openOverlay({icon:isFinal?'🏆':'📦',title:isFinal?t('allClear'):t('sokobanClear'),sub:'+'+gained,stars,enterToNext:!isFinal,
    primary:isFinal?{label:t('levelsTitle'),fn:function(){closeOverlay();openSokobanLevels();}}
      :{label:t('next'),fn:function(){closeOverlay();startSokobanLevel(sokobanState.level+1);}},
    secondary:{label:t('retry'),fn:function(){closeOverlay();startSokobanLevel(sokobanState.level);}}});
}
function startSokobanLevel(level){
  stopAllGames();
  showScreen('sokoban');
  $('#sokobanLevelChip').textContent = t('levelN',{n:level});
  const gen = generateSokoban(level);
  sokobanState.level = level;
  sokobanState.W = gen.W; sokobanState.H = gen.H;
  sokobanState.isWall = gen.isWall; sokobanState.goals = gen.goals;
  sokobanState.boxes = gen.boxes; sokobanState.player = gen.player;
  sokobanState.steps = 0; sokobanState.active = true; sokobanState.solved = false;
  sokobanState.cellEls = [];
  renderSokoban(); updateSokobanStat();
}

const MATCH_EMOJI = ['🍎','🍋','🍇','🥝','🫐','🍊','🍓'];
const MATCH_COLORS = [
  'linear-gradient(160deg,#ff7b7b,#c92a2a)','linear-gradient(160deg,#ffe066,#e6a700)',
  'linear-gradient(160deg,#b197fc,#7048e8)','linear-gradient(160deg,#69db7c,#2f9e44)',
  'linear-gradient(160deg,#74c0fc,#1971c2)','linear-gradient(160deg,#ffa94d,#e8590c)',
  'linear-gradient(160deg,#f783ac,#c2255c)'
];
const matchState = { level:1,grid:6,types:4,moves:22,target:312,score:0,board:[],cellEls:[],selected:null,busy:false,active:false,combo:0 };
function getMatchConfig(lv){
  let grid, types, moves;
  if (lv<=30){ grid=6; types=4; moves=22; }
  else if (lv<=70){ grid=7; types=4; moves=22; }
  else if (lv<=120){ grid=7; types=5; moves=24; }
  else if (lv<=170){ grid=8; types=5; moves=26; }
  else if (lv<=220){ grid=8; types=6; moves=28; }
  else if (lv<=260){ grid=9; types=6; moves=30; }
  else { grid=9; types=7; moves=32; }
  return {grid,types,moves,target:300+lv*12};
}
function createMatchBoard(grid,types){
  const board = [];
  for (let r=0;r<grid;r++){
    board.push([]);
    for (let c=0;c<grid;c++){
      let type, guard = 0;
      do { type = randInt(0,types-1); guard++; if (guard>40) break; }
      while (
        (c>=2 && board[r][c-1].type===type && board[r][c-2].type===type) ||
        (r>=2 && board[r-1][c].type===type && board[r-2][c].type===type)
      );
      board[r].push({type});
    }
  }
  return board;
}
function findMatchTiles(board,grid){
  const matched = new Set();
  for (let r=0;r<grid;r++){
    let c = 0;
    while (c<grid){
      if (!board[r][c]){ c++; continue; }
      const type = board[r][c].type;
      let end = c+1;
      while (end<grid && board[r][end] && board[r][end].type===type) end++;
      if (end-c>=3) for (let k=c;k<end;k++) matched.add(r*grid+k);
      c = end;
    }
  }
  for (let c=0;c<grid;c++){
    let r = 0;
    while (r<grid){
      if (!board[r][c]){ r++; continue; }
      const type = board[r][c].type;
      let end = r+1;
      while (end<grid && board[end][c] && board[end][c].type===type) end++;
      if (end-r>=3) for (let k=r;k<end;k++) matched.add(k*grid+c);
      r = end;
    }
  }
  return Array.from(matched);
}
function matchHasMoves(board,grid){
  const swapCheck = function(r1,c1,r2,c2){
    [board[r1][c1],board[r2][c2]] = [board[r2][c2],board[r1][c1]];
    const has = findMatchTiles(board,grid).length>0;
    [board[r1][c1],board[r2][c2]] = [board[r2][c2],board[r1][c1]];
    return has;
  };
  for (let r=0;r<grid;r++) for (let c=0;c<grid;c++){
    if (c+1<grid && swapCheck(r,c,r,c+1)) return true;
    if (r+1<grid && swapCheck(r,c,r+1,c)) return true;
  }
  return false;
}
function matchApplyGravity(board,grid,types){
  for (let c=0;c<grid;c++){
    let writeRow = grid-1;
    for (let r=grid-1;r>=0;r--){
      if (board[r][c]){
        if (writeRow!==r){ board[writeRow][c] = board[r][c]; board[r][c] = null; }
        writeRow--;
      }
    }
    for (let r=writeRow;r>=0;r--) board[r][c] = {type:randInt(0,types-1),isNew:true};
  }
}
function buildMatchBoardDom(){
  const grid = matchState.grid;
  const boardEl = $('#matchBoard');
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = `repeat(${grid},1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${grid},1fr)`;
  const gapSize = grid<=6?5:grid<=8?4:3;
  boardEl.style.gap = gapSize+'px';
  const cellEls = [];
  for (let r=0;r<grid;r++){
    cellEls.push([]);
    for (let c=0;c<grid;c++){
      const cell = document.createElement('div');
      cell.className = 'match-cell';
      cell.dataset.r = r; cell.dataset.c = c;
      boardEl.appendChild(cell); cellEls[r].push(cell);
    }
  }
  matchState.cellEls = cellEls;
  requestAnimationFrame(function(){
    const size = boardEl.clientWidth;
    if (!size) return;
    const cellSize = (size-12-(grid-1)*gapSize)/grid;
    boardEl.style.setProperty('--tile-font', Math.round(cellSize*0.58)+'px');
  });
}
function renderMatchBoard(){
  const grid = matchState.grid, board = matchState.board;
  for (let r=0;r<grid;r++) for (let c=0;c<grid;c++){
    const cell = matchState.cellEls[r][c];
    const tile = board[r][c];
    let el = cell.querySelector('.match-tile');
    if (!tile){ if (el) el.remove(); continue; }
    const isNewEl = !el;
    if (!el){ el = document.createElement('div'); el.className = 'match-tile'; cell.appendChild(el); }
    el.dataset.type = tile.type;
    el.style.background = MATCH_COLORS[tile.type];
    el.textContent = MATCH_EMOJI[tile.type];
    el.classList.remove('selected','clearing');
    if (isNewEl){
      el.classList.add('dropping');
      setTimeout(function(){ el.classList.remove('dropping'); }, 260);
    }
  }
}
function updateMatchHUD(){
  const s = matchState.score, target = matchState.target, moves = matchState.moves;
  $('#matchScore').textContent = s;
  $('#matchTarget').textContent = target;
  $('#matchMoves').textContent = moves;
  const movesEl = $('#matchMoves');

  const p = clamp(s/target,0,1);

  bar.style.background = p>=0.75?'linear-gradient(90deg,#2ee6a8,#00e0c6)':
    p>=0.4?'linear-gradient(90deg,#ffd166,#7c5cff)':'linear-gradient(90deg,#7c5cff,#2ee6a8)';
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function resolveMatchCascade(){
  let chain = 0;
  while (true){
    const matched = findMatchTiles(matchState.board,matchState.grid);
    if (!matched.length) break;
    chain++;
    for (const idx of matched){
      const r = Math.floor(idx/matchState.grid), c = idx%matchState.grid;
      const el = matchState.cellEls[r][c].querySelector('.match-tile');
      if (el) el.classList.add('clearing');
    }
    beep(560+chain*80,0.07,'sine',0.06);
    vibrate(chain>1?12:6);
    await sleep(240);
    matchState.score += matched.length*10*chain;
    for (const idx of matched){
      const r = Math.floor(idx/matchState.grid), c = idx%matchState.grid;
      matchState.board[r][c] = null;
    }
    matchApplyGravity(matchState.board,matchState.grid,matchState.types);
    renderMatchBoard(); updateMatchHUD();
    await sleep(190);
  }
  return chain;
}
function updateMatchSelection(){
  document.querySelectorAll('.match-tile.selected').forEach(el=>el.classList.remove('selected'));
  const sel = matchState.selected;
  if (sel){
    const el = matchState.cellEls[sel.r][sel.c].querySelector('.match-tile');
    if (el) el.classList.add('selected');
  }
}
async function matchTrySwap(r1,c1,r2,c2){
  if (matchState.busy||!matchState.active) return;
  matchState.busy = true;
  [matchState.board[r1][c1],matchState.board[r2][c2]] = [matchState.board[r2][c2],matchState.board[r1][c1]];
  renderMatchBoard();
  await sleep(130);
  const matched = findMatchTiles(matchState.board,matchState.grid);
  if (!matched.length){
    [matchState.board[r1][c1],matchState.board[r2][c2]] = [matchState.board[r2][c2],matchState.board[r1][c1]];
    renderMatchBoard();
    beep(180,0.08,'square',0.04);
    await sleep(140);
    matchState.busy = false;
    return;
  }
  matchState.moves--;
  updateMatchHUD();
  await resolveMatchCascade();
  if (!matchHasMoves(matchState.board,matchState.grid)){
    for (let i=0;i<50;i++){
      matchState.board = createMatchBoard(matchState.grid,matchState.types);
      if (matchHasMoves(matchState.board,matchState.grid)) break;
    }
    renderMatchBoard();
  }
  if (matchState.score>=matchState.target) matchWin();
  else if (matchState.moves<=0) matchLose();
  matchState.busy = false;
}
function onMatchTileTap(r,c){
  if (matchState.busy||!matchState.active) return;
  if (!matchState.board[r][c]) return;
  const sel = matchState.selected;
  if (!sel){ matchState.selected = {r,c}; updateMatchSelection(); beep(520,0.04,'sine',0.035); return; }
  if (sel.r===r&&sel.c===c){ matchState.selected = null; updateMatchSelection(); return; }
  const dist = Math.abs(sel.r-r)+Math.abs(sel.c-c);
  if (dist===1){
    const sr = sel.r, sc = sel.c;
    matchState.selected = null; updateMatchSelection();
    matchTrySwap(sr,sc,r,c);
  } else {
    matchState.selected = {r,c}; updateMatchSelection(); beep(520,0.04,'sine',0.035);
  }
}
function matchWin(){
  matchState.active = false;
  const remainRatio = matchState.moves/getMatchConfig(matchState.level).moves;
  const stars = remainRatio>0.3?3:remainRatio>0.1?2:1;
  state.match.score += matchState.score;
  state.match.unlocked = Math.max(state.match.unlocked, Math.min(MATCH_TOTAL, matchState.level+1));
  save(); updateHome();
  beep(880,0.09,'sine',0.08);
  setTimeout(function(){ beep(1568,0.16,'sine',0.07); }, 185);
  vibrate(20);
  const isFinal = matchState.level>=MATCH_TOTAL;
  const title = isFinal?t('allClear'):stars===3?t('perfect'):stars===2?t('great'):t('good');
  openOverlay({icon:stars===3?'🌟':isFinal?'🏆':'🎉',title,sub:t('scoreNum',{n:matchState.score}),stars,enterToNext:!isFinal,
    primary:isFinal?{label:t('levelsTitle'),fn:function(){closeOverlay();openMatchLevels();}}
      :{label:t('next'),fn:function(){closeOverlay();startMatchLevel(matchState.level+1);}},
    secondary:{label:t('retry'),fn:function(){closeOverlay();startMatchLevel(matchState.level);}}});
}
function matchLose(){
  matchState.active = false;
  beep(220,0.18,'sawtooth',0.055);
  vibrate([40,60,40]);
  openOverlay({icon:'😢',title:t('matchFail'),sub:t('scoreNum',{n:matchState.score})+' / '+matchState.target,
    stars:0,enterToNext:false,
    primary:{label:t('retry'),fn:function(){closeOverlay();startMatchLevel(matchState.level);}},
    secondary:{label:t('levelsTitle'),fn:function(){closeOverlay();openMatchLevels();}}});
}
function startMatchLevel(level){
  stopAllGames();
  const cfg = getMatchConfig(level);
  matchState.level = level;
  matchState.grid = cfg.grid; matchState.types = cfg.types;
  matchState.moves = cfg.moves; matchState.target = cfg.target;
  matchState.score = 0; matchState.selected = null; matchState.busy = false; matchState.combo = 0;
  let board = createMatchBoard(cfg.grid,cfg.types);
  for (let i=0;i<30;i++){
    if (matchHasMoves(board,cfg.grid)) break;
    board = createMatchBoard(cfg.grid,cfg.types);
  }
  matchState.board = board;
  matchState.active = true;
  showScreen('match');
  $('#matchLevelChip').textContent = t('levelN',{n:level});
  buildMatchBoardDom(); renderMatchBoard(); updateMatchHUD();
}
